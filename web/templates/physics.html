<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB Physics HL stuff</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1638;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .bg-shape {
            position: fixed;
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
        }

        .bg-shape:nth-child(1) {
            width: 300px;
            height: 300px;
            background: #9d8a4a;
            border-radius: 50%;
            top: 10%;
            left: 10%;
            animation: float 20s infinite ease-in-out;
        }

        .bg-shape:nth-child(2) {
            width: 200px;
            height: 200px;
            background: #8f7d3a;
            border-radius: 20%;
            top: 60%;
            right: 15%;
            animation: float 15s infinite ease-in-out reverse;
            transform: rotate(45deg);
        }

        .bg-shape:nth-child(3) {
            width: 0;
            height: 0;
            border-left: 125px solid transparent;
            border-right: 125px solid transparent;
            border-bottom: 250px solid #a89d5a;
            background: transparent;
            bottom: 20%;
            left: 20%;
            animation: float 18s infinite ease-in-out;
        }

        .bg-shape:nth-child(4) {
            width: 180px;
            height: 180px;
            background: #8a7d4a;
            border-radius: 30px;
            top: 30%;
            right: 30%;
            animation: float 22s infinite ease-in-out reverse;
        }

        .bg-shape:nth-child(5) {
            width: 220px;
            height: 140px;
            background: #7a8d6a;
            border-radius: 50%;
            top: 45%;
            left: 50%;
            animation: float 17s infinite ease-in-out;
        }

        .bg-shape:nth-child(6) {
            width: 160px;
            height: 160px;
            background: #8a7d6a;
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
            bottom: 35%;
            right: 20%;
            animation: float 19s infinite ease-in-out reverse;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }

        .container, .header, .question-container {
            position: relative;
            z-index: 1;
        }

        #questionsWrapper {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .container {
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            max-width: calc(1200px * 0.65);
            margin-left: auto;
            margin-right: auto;
        }

        .header h1 {
            color: #333;
            margin-bottom: 5px;
        }

        .header .author {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        select, button {
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #667eea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        select {
            background: white;
            color: #333;
        }

        button {
            background: #667eea;
            color: white;
            font-weight: 600;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .question-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            max-width: calc(1200px * 0.65);
            margin-left: auto;
            margin-right: auto;
            transition: max-width 0.3s ease;
        }

        .question-container.wide {
            max-width: calc((1200px * 0.65) * 2);
        }

        .question-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        .question-meta {
            color: #666;
        }

        .question-meta span {
            background: #f0f0f0;
            padding: 5px 12px;
            border-radius: 5px;
            margin-right: 10px;
            font-size: 14px;
        }

        .images-container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            align-items: flex-start;
        }

        .image-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            flex: 1;
            min-width: 0;
        }

        .image-section h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .image-section > div {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
        }

        .image-section img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }

        .image-section > div:has(img:only-child) img {
            width: 100%;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn-show-answer {
            background: #3b82f6;
        }

        .btn-show-answer:hover {
            background: #2563eb;
        }

        .btn-chatgpt {
            background: #3b82f6;
        }

        .btn-chatgpt:hover {
            background: #2563eb;
        }

        .btn-gabriel {
            background: #6b7280;
        }

        .btn-gabriel:hover {
            background: #4b5563;
        }

        .btn-gabriel.active {
            background: #10b981;
        }

        .btn-gabriel.active:hover {
            background: #059669;
        }

        .btn-save {
            background: #6b7280;
            font-size: 24px;
            padding: 10px 20px;
        }

        .btn-save:hover {
            background: #4b5563;
        }

        .btn-save.saved {
            background: #f59e0b;
        }

        .history-dropdown {
            position: relative;
            display: inline-block;
        }

        .history-btn {
            background: #6b7280;
            color: white;
            padding: 0;
            font-size: 14px;
            font-weight: 600;
            border: 2px solid #d1d5db;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            width: 40px;
            height: 40px;
            min-width: 40px;
            min-height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .history-btn:hover {
            background: #4b5563;
            border-color: #d1d5db;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(107, 114, 128, 0.4);
        }

        .history-btn.active {
            background: #10b981;
            border-color: #d1d5db;
        }

        .history-btn.active:hover {
            background: #059669;
            border-color: #d1d5db;
        }

        /* Dark mode styles */
        body.dark-mode .header,
        body.dark-mode .question-container,
        body.dark-mode #historyPanel,
        body.dark-mode #savedPanel,
        body.dark-mode .timer-sidebar {
            background: #1f2937;
            color: #e5e7eb;
        }

        body.dark-mode .header h1,
        body.dark-mode .question-container h3,
        body.dark-mode .timer-label,
        body.dark-mode .note-header,
        body.dark-mode .note-content {
            color: #e5e7eb;
        }

        body.dark-mode .question-meta span {
            background: #4b5563;
            color: #e5e7eb;
        }

        body.dark-mode .image-section {
            background: #374151;
        }

        body.dark-mode .note-item,
        body.dark-mode .chat-message {
            background: #374151;
        }

        body.dark-mode .modal-content {
            background: #1f2937;
            color: #e5e7eb;
        }

        body.dark-mode #chatMessages {
            border-color: #4b5563;
            background: #111827;
        }

        body.dark-mode .note-input-area textarea,
        body.dark-mode .chat-input-area input {
            background: #374151;
            border-color: #4b5563;
            color: #e5e7eb;
        }

        body.dark-mode .history-btn {
            border-color: #000000;
        }

        body.dark-mode .history-btn:hover {
            border-color: #000000;
        }

        body.dark-mode .history-btn.active {
            border-color: #000000;
        }

        body.dark-mode .history-btn.active:hover {
            border-color: #000000;
        }

        body.dark-mode .user-info span {
            color: #ef4444;
        }

        body.dark-mode select {
            background: #374151;
            color: #d1d5db;
            border-color: #4b5563;
        }

        body.dark-mode select option {
            background: #374151;
            color: #d1d5db;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 160px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            z-index: 1;
            border-radius: 8px;
            overflow: hidden;
        }

        .dropdown-content a {
            color: #333;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            cursor: pointer;
            transition: background 0.2s;
        }

        .dropdown-content a:hover {
            background-color: #f0f0f0;
        }

        .dropdown-content button {
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            color: #333;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
        }

        .dropdown-content button:hover {
            background-color: #f0f0f0;
        }

        .dropdown-content button.danger {
            color: #ef4444;
        }

        .dropdown-content button.danger:hover {
            background-color: #fee2e2;
        }

        .text-incomplete-warning {
            background: #fef2f2;
            border-left: 2px solid #fca5a5;
            padding: 8px 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-size: 12px;
            color: #991b1b;
            line-height: 1.4;
        }

        .history-dropdown:hover .dropdown-content {
            display: block;
        }

        #historyPanel, #savedPanel {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            max-width: calc(1200px * 0.65);
            margin-left: auto;
            margin-right: auto;
        }

        .history-item, .saved-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

        .history-item:hover, .saved-item:hover {
            background: #f9f9f9;
        }

        .history-item:last-child, .saved-item:last-child {
            border-bottom: none;
        }

        .btn-auth {
            padding: 8px 16px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-auth:hover {
            background: #2563eb;
        }

        .btn-physics {
            padding: 8px 16px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-physics:hover {
            background: #059669;
        }

        .btn-logout {
            padding: 8px 16px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 10px;
        }

        .btn-logout:hover {
            background: #dc2626;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #333;
            font-weight: 500;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .switch-mode {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }

        .switch-mode a {
            color: #3b82f6;
            cursor: pointer;
            text-decoration: underline;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        .timer-sidebar {
            position: fixed;
            right: 20px;
            top: 20px;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 100;
            min-width: 180px;
        }

        .timer-section {
            margin-bottom: 15px;
        }

        .timer-section:last-child {
            margin-bottom: 0;
        }

        .timer-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .timer-value {
            font-size: 20px;
            font-weight: 600;
            color: #667eea;
        }

        .notes-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }

        .notes-section h3 {
            color: #333;
            margin-bottom: 20px;
        }

        .note-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
            color: #666;
        }

        .note-author {
            font-weight: bold;
            color: #667eea;
        }

        .note-content {
            color: #333;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .note-input-area {
            margin-top: 20px;
        }

        .note-input-area textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
        }

        .note-input-area textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .note-input-area button {
            margin-top: 10px;
        }

        .btn-more {
            background: #8b5cf6;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #8b5cf6;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-more:hover {
            background: #7c3aed;
            border-color: #7c3aed;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4);
        }

        #chatModal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }

        #chatModal.show {
            display: flex;
        }

        #chatModal .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        #chatModal h2 {
            margin-bottom: 15px;
            color: #333;
        }

        #chatMessages {
            flex: 1;
            overflow-y: auto;
            border: 2px solid #eee;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            min-height: 300px;
            max-height: 400px;
        }

        .chat-message {
            margin-bottom: 12px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 6px;
        }

        .chat-message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 12px;
        }

        .chat-username {
            font-weight: bold;
            color: #667eea;
        }

        .chat-timestamp {
            color: #999;
        }

        .chat-text {
            color: #333;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .chat-input-area input:focus {
            outline: none;
            border-color: #667eea;
        }

        .chat-input-area button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .chat-input-area button:hover {
            background: #5568d3;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .password-btn {
            flex: 1;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border: 3px solid #ddd;
            border-radius: 8px;
            background: white;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
        }

        .password-btn:hover {
            border-color: #3b82f6;
            transform: scale(1.05);
        }

        .password-btn.selected {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }


        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            select, button {
                width: 100%;
            }

            .images-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="bg-shape"></div>
    <div class="bg-shape"></div>
    <div class="bg-shape"></div>
    <div class="bg-shape"></div>
    <div class="bg-shape"></div>
    <div class="bg-shape"></div>

    <!-- Timer Sidebar -->
    <div class="timer-sidebar" id="timerSidebar" style="display: none;">
        <div class="timer-section">
            <div class="timer-label">Current Question</div>
            <div class="timer-value" id="currentQuestionTimer">00:00</div>
        </div>
        <div class="timer-section">
            <div class="timer-label">Today's Total</div>
            <div class="timer-value" id="dailyTimer">00:00</div>
        </div>
    </div>

    <!-- Login/Register Modal -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Login</h2>
            <div id="errorMessage" class="error-message hidden"></div>
            <div class="form-group">
                <label for="usernameInput">Username</label>
                <input type="text" id="usernameInput" placeholder="Enter username" maxlength="20">
            </div>
            <div class="form-group">
                <label>Pick your password:</label>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button type="button" class="password-btn" onclick="selectPassword('1234')" id="password1234">1234</button>
                    <button type="button" class="password-btn" onclick="selectPassword('4321')" id="password4321">4321</button>
                </div>
                <input type="hidden" id="selectedPassword" value="">
            </div>
            <div class="modal-actions">
                <button class="btn-primary" id="submitBtn" onclick="submitAuth()">Login</button>
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
            </div>
            <div class="switch-mode">
                <span id="switchText">Don't have an account? <a onclick="switchMode()">Register</a></span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div>
                    <h1 style="margin: 0;">IB Physics HL stuff</h1>
                    <div class="author">by: Xiao He</div>
                </div>
                <div id="authSection" style="display: flex; gap: 10px; align-items: center;">
                    <a href="/" class="btn-physics">Home</a>
                    <a href="/math" class="btn-physics">Math</a>
                    <a href="/economics" class="btn-physics">Economics</a>
                    <button onclick="showLoginModal()" class="btn-auth">Login</button>
                </div>
            </div>
            <div class="controls">
                <select id="paperSelect">
                    <option value="">All Papers</option>
                </select>
                <select id="topicSelect">
                    <option value="">All Topics</option>
                </select>
                <select id="subtopicSelect">

            <h2>Saved Questions</h2>

        <div id="questionsWrapper">

            <div class="question-info">
                <div class="question-meta">
                    <span id="paperInfo"></span>
                    <span id="topicInfo"></span>

                <button class="btn-show-answer" onclick="showAnswer()">Show Answer</button>
                <button class="btn-chatgpt" onclick="askChatGPT()">Ask ChatGPT</button>

                    <textarea id="newNoteText" placeholder="Share your thoughts, solutions, or tips for this question..."></textarea>
                    <button onclick="postNote()">Post Note</button>
                </div>

            Loading question...
        </div>

            &nbsp;

    <script>
        let currentQuestion = null;
        let allTopics = null;
        let gabrielMode = false;
        let questionHistory = [];
        let isLoginMode = true;
        let currentUser = null;

        function displayImages(container, imageSrcs) {
            container.innerHTML = '';
            imageSrcs.forEach(src => {
                const img = document.createElement('img');
                img.src = src;
                container.appendChild(img);
            });
        }

        function toggleGabrielMode() {
            gabrielMode = !gabrielMode;
            const btn = document.getElementById('gabrielModeBtn');
            if (gabrielMode) {
                btn.textContent = 'Gabriel Mode: ON';
                btn.classList.add('active');
            } else {
                btn.textContent = 'Gabriel Mode: OFF';
                btn.classList.remove('active');
                // Clear all extra questions when turning off
                questionHistory = [];
                const wrapper = document.getElementById('questionsWrapper');
                const containers = wrapper.querySelectorAll('.question-container:not(#questionContainer)');
                containers.forEach(c => c.remove());
            }
        }

        // Load topics on page load
        async function loadTopics() {
            const response = await fetch('/api/physics/topics');
            allTopics = await response.json();

            // Populate paper dropdown
            const paperSelect = document.getElementById('paperSelect');
            Object.keys(allTopics).forEach(paper => {
                const option = document.createElement('option');
                option.value = paper;
                option.textContent = paper.replace('_', ' ').replace(/\b\w/g, l => l.toUpperCase());
                paperSelect.appendChild(option);
            });
        }

        // Update topic dropdown when paper changes
        document.getElementById('paperSelect').addEventListener('change', function() {
            const paper = this.value;
            const topicSelect = document.getElementById('topicSelect');
            const subtopicSelect = document.getElementById('subtopicSelect');

            topicSelect.innerHTML = '<option value="">All Topics</option>';
            subtopicSelect.innerHTML = '<option value="">All Subtopics</option>';

            if (paper && allTopics[paper]) {
                // Sort topics by their letter code (A, B, C, D, E)
                const sortedTopics = Object.keys(allTopics[paper]).sort((a, b) => {
                    const codeA = a.split(':')[0].trim();
                    const codeB = b.split(':')[0].trim();
                    return codeA.localeCompare(codeB);
                });

                sortedTopics.forEach(topic => {
                    const option = document.createElement('option');
                    option.value = topic;
                    option.textContent = topic;
                    topicSelect.appendChild(option);
                });
            }
        });

        // Update subtopic dropdown when topic changes
        document.getElementById('topicSelect').addEventListener('change', function() {
            const paper = document.getElementById('paperSelect').value;
            const topic = this.value;
            const subtopicSelect = document.getElementById('subtopicSelect');

            subtopicSelect.innerHTML = '<option value="">All Subtopics</option>';

            if (paper && topic && allTopics[paper] && allTopics[paper][topic]) {
                // Sort subtopics by their numeric code (A.1, A.2, B.1, etc.)
                const sortedSubtopics = allTopics[paper][topic].sort((a, b) => {
                    const codeA = a.split(':')[0].trim();
                    const codeB = b.split(':')[0].trim();

                    // Extract letter and number (e.g., "A.1" -> ["A", "1"])
                    const [letterA, numA] = codeA.split('.');
                    const [letterB, numB] = codeB.split('.');

                    // Compare letters first
                    if (letterA !== letterB) {
                        return letterA.localeCompare(letterB);
                    }

                    // Then compare numbers
                    return parseInt(numA) - parseInt(numB);
                });

                sortedSubtopics.forEach(subtopic => {
                    const option = document.createElement('option');
                    option.value = subtopic;
                    option.textContent = subtopic;
                    subtopicSelect.appendChild(option);
                });
            }
        });

        async function loadRandomQuestion() {
            const paper = document.getElementById('paperSelect').value;
            const topic = document.getElementById('topicSelect').value;
            const subtopic = document.getElementById('subtopicSelect').value;

            // Clear all Gabriel mode questions when loading new question normally
            if (!gabrielMode) {
                const wrapper = document.getElementById('questionsWrapper');
                const containers = wrapper.querySelectorAll('.question-container:not(#questionContainer)');
                containers.forEach(c => c.remove());
            }

            // Show loading
            document.getElementById('questionContainer').classList.add('hidden');
            document.getElementById('noQuestion').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            // Build API URL with filters
            let url = '/api/physics/random';
            if (paper || topic || subtopic) {
                // Use filter endpoint if any filter is selected
                const params = new URLSearchParams();
                if (paper) params.append('paper', paper);
                if (topic) params.append('topic', topic);
                if (subtopic) params.append('subtopic', subtopic);
                url = `/api/physics/question/filter?${params.toString()}`;
            }

            try {
                const response = await fetch(url);
                const data = await response.json();
                currentQuestion = data;
                displayQuestion(data);
            } catch (error) {
                console.error('Error loading question:', error);
                alert('Error loading question. Please try again.');
            }

            document.getElementById('loading').classList.add('hidden');
        }

        async function loadRandomQuestionGabrielMode() {
            const paper = document.getElementById('paperSelect').value;
            const topic = document.getElementById('topicSelect').value;
            const subtopic = document.getElementById('subtopicSelect').value;

            // Build API URL with filters
            let url = '/api/physics/random';
            if (paper || topic || subtopic) {
                // Use filter endpoint if any filter is selected
                const params = new URLSearchParams();
                if (paper) params.append('paper', paper);
                if (topic) params.append('topic', topic);
                if (subtopic) params.append('subtopic', subtopic);
                url = `/api/physics/question/filter?${params.toString()}`;
            }

            try {
                const response = await fetch(url);
                const data = await response.json();

                // Generate unique timestamp FIRST
                const timestamp = Date.now();

                // Create a new question container
                const newContainer = document.createElement('div');
                newContainer.className = 'question-container';
                newContainer.style.marginTop = '30px';
                newContainer.innerHTML = `
                    <div class="question-info">
                        <div class="question-meta">
                            <span>${data.paper}</span>
                            <span>${data.topic_code}: ${data.primary_topic}</span>
                            <span>${data.subtopic_code}: ${data.primary_subtopic}</span>
                        </div>
                        <div class="question-id" style="color: #999; font-size: 14px;">${data.question_id}</div>
                    </div>
                    <div class="images-container">
                        <div class="image-section">
                            <div class="question-images-${timestamp}"></div>
                        </div>
                        <div class="image-section hidden answer-section-${timestamp}">
                            <div class="answer-images-${timestamp}"></div>
                        </div>
                    </div>
                    <div class="actions">
                        <button class="btn-show-answer" onclick="showAnswerForContainer(this)">Show Answer</button>
                        <button class="btn-chatgpt" onclick="askChatGPTForContainer(this, '${data.paper}', '${data.path}')">Ask ChatGPT</button>
                    </div>
                `;

                document.getElementById('questionsWrapper').appendChild(newContainer);

                // Load images for the new question
                const questionPath = data.path;
                const pathParts = questionPath.split('/');
                const questionNum = pathParts[pathParts.length - 1];
                const questionImagesDiv = newContainer.querySelector(`.question-images-${timestamp}`);

                const maxPages = 10;
                const imagePromises = [];

                for (let pageNum = 1; pageNum <= maxPages; pageNum++) {
                    const promise = new Promise((resolve) => {
                        const img = new Image();
                        img.src = `/api/physics/image/${data.paper}/${questionNum}/question_p${pageNum}.png`;
                        img.onload = () => resolve({page: pageNum, src: img.src});
                        img.onerror = () => resolve(null);
                    });
                    imagePromises.push(promise);
                }

                Promise.all(imagePromises).then(results => {
                    const questionImages = results.filter(r => r !== null).sort((a, b) => a.page - b.page);
                    displayImages(questionImagesDiv, questionImages.map(i => i.src));
                });

                // Store question data
                newContainer.dataset.questionData = JSON.stringify(data);

            } catch (error) {
                console.error('Error loading question:', error);
            }
        }

        function displayQuestion(question) {
            // Show container
            const questionContainer = document.getElementById('questionContainer');
            const answerSection = document.getElementById('answerSection');

            questionContainer.classList.remove('hidden');
            answerSection.classList.add('hidden');

            // Reset wide class (only added when answer is shown)
            questionContainer.classList.remove('wide');

            // Update metadata - use new IB structure
            document.getElementById('paperInfo').textContent = question.paper;
            document.getElementById('topicInfo').textContent = `${question.topic_code}: ${question.primary_topic}`;
            document.getElementById('subtopicInfo').textContent = `${question.subtopic_code}: ${question.primary_subtopic}`;
            document.getElementById('questionId').textContent = question.question_id;

            // Track view and check if saved
            if (currentUser) {
                trackView(question.question_id);
                checkIfSaved(question.question_id);
            } else {
                document.getElementById('saveBtn').style.display = 'none';
            }

            // Display question images
            const questionPath = question.path;
            const pathParts = questionPath.split('/');
            const paper = question.paper;
            const questionNum = pathParts[pathParts.length - 1];

            const questionImagesDiv = document.getElementById('questionImages');
            questionImagesDiv.innerHTML = '';

            // Find all question images (try up to 10 pages in parallel)
            const maxPages = 10;
            const imagePromises = [];

            for (let pageNum = 1; pageNum <= maxPages; pageNum++) {
                const promise = new Promise((resolve) => {
                    const img = new Image();
                    img.src = `/api/physics/image/${paper}/${questionNum}/question_p${pageNum}.png`;
                    img.onload = () => resolve({page: pageNum, src: img.src});
                    img.onerror = () => resolve(null);
                });
                imagePromises.push(promise);
            }

            Promise.all(imagePromises).then(results => {
                const questionImages = results.filter(r => r !== null).sort((a, b) => a.page - b.page);
                displayImages(questionImagesDiv, questionImages.map(i => i.src));
            });
        }

        async function showAnswer() {
            const answerSection = document.getElementById('answerSection');
            answerSection.classList.remove('hidden');

            // Always expand when both question and answer are visible
            document.getElementById('questionContainer').classList.add('wide');

            // Add small warning for incomplete text (only shown when answer is displayed)
            const existingWarning = answerSection.querySelector('.text-incomplete-warning');
            if (existingWarning) {
                existingWarning.remove();
            }

            if (currentQuestion.text_incomplete) {
                const warningDiv = document.createElement('div');
                warningDiv.className = 'text-incomplete-warning';
                warningDiv.textContent = '⚠️ Note: Answer is AI generated and can be wrong (like 2% of the time) as graphs were not given to the AI';
                answerSection.insertBefore(warningDiv, answerSection.firstChild);
            }

            const questionPath = currentQuestion.path;
            const pathParts = questionPath.split('/');
            const paper = currentQuestion.paper;
            const questionNum = pathParts[pathParts.length - 1];

            const answerImagesDiv = document.getElementById('answerImages');
            answerImagesDiv.innerHTML = '';

            // Load answer images (try up to 10 pages in parallel)
            const maxPages = 10;
            const imagePromises = [];

            for (let pageNum = 1; pageNum <= maxPages; pageNum++) {
                const promise = new Promise((resolve) => {
                    const img = new Image();
                    img.src = `/api/physics/image/${paper}/${questionNum}/answer_p${pageNum}.png`;
                    img.onload = () => resolve({page: pageNum, src: img.src});
                    img.onerror = () => resolve(null);
                });
                imagePromises.push(promise);
            }

            Promise.all(imagePromises).then(async results => {
                const answerImages = results.filter(r => r !== null).sort((a, b) => a.page - b.page);

                if (answerImages.length > 0) {
                    // Show answer images
                    displayImages(answerImagesDiv, answerImages.map(i => i.src));
                } else {
                    // No images found - try to load text answer (for Paper 1)
                    try {
                        const response = await fetch(`/api/physics/answer-text/${paper}/${questionNum}`);
                        const data = await response.json();
                        if (data.hasAnswer) {
                            answerImagesDiv.innerHTML = `<div style="padding: 20px; background: #f9f9f9; border-radius: 8px; white-space: pre-wrap; font-family: monospace; line-height: 1.6;">${data.answer}</div>`;
                        } else {
                            answerImagesDiv.innerHTML = '<p style="padding: 20px; color: #666;">No answer available for this question.</p>';
                        }
                    } catch (error) {
                        answerImagesDiv.innerHTML = '<p style="padding: 20px; color: #666;">No answer available for this question.</p>';
                    }
                }

                // If Gabriel mode is on, load a new question below
                if (gabrielMode) {
                    setTimeout(() => {
                        loadRandomQuestionGabrielMode();
                    }, 500);
                }
            });
        }

        async function askChatGPT() {
            const questionPath = currentQuestion.path;
            const pathParts = questionPath.split('/');
            const paper = currentQuestion.paper;
            const questionNum = pathParts[pathParts.length - 1];

            // Fetch question text
            const response = await fetch(`/api/physics/text/${paper}/${questionNum}`);
            const data = await response.json();

            if (data.error) {
                alert('Question text not found. Please make sure text extraction completed.');
                return;
            }

            // Replace spaces with + signs for URL
            const encodedText = data.text.replace(/ /g, '+');
            const url = `https://chatgpt.com/?prompt=${encodedText}`;

            window.open(url, '_blank');
        }

        async function showAnswerForContainer(button) {
            const container = button.closest('.question-container');
            const data = JSON.parse(container.dataset.questionData);
            const answerSection = container.querySelector('[class*="answer-section-"]');
            const answerImagesDiv = container.querySelector('[class*="answer-images-"]');

            answerSection.classList.remove('hidden');
            container.classList.add('wide');

            const questionPath = data.path;
            const pathParts = questionPath.split('/');
            const paper = data.paper;
            const questionNum = pathParts[pathParts.length - 1];

            answerImagesDiv.innerHTML = '';

            const maxPages = 10;
            const imagePromises = [];

            for (let pageNum = 1; pageNum <= maxPages; pageNum++) {
                const promise = new Promise((resolve) => {
                    const img = new Image();
                    img.src = `/api/physics/image/${paper}/${questionNum}/answer_p${pageNum}.png`;
                    img.onload = () => resolve({page: pageNum, src: img.src});
                    img.onerror = () => resolve(null);
                });
                imagePromises.push(promise);
            }

            Promise.all(imagePromises).then(results => {
                const answerImages = results.filter(r => r !== null).sort((a, b) => a.page - b.page);
                displayImages(answerImagesDiv, answerImages.map(i => i.src));

                // Load new question in Gabriel mode
                if (gabrielMode) {
                    setTimeout(() => {
                        loadRandomQuestionGabrielMode();
                    }, 500);
                }
            });
        }

        async function askChatGPTForContainer(button, paper, path) {
            const pathParts = path.split('/');
            const questionNum = pathParts[pathParts.length - 1];

            const response = await fetch(`/api/physics/text/${paper}/${questionNum}`);
            const data = await response.json();

            if (data.error) {
                alert('Question text not found. Please make sure text extraction completed.');
                return;
            }

            const encodedText = data.text.replace(/ /g, '+');
            const url = `https://chatgpt.com/?prompt=${encodedText}`;

            window.open(url, '_blank');
        }

        // Auth functions
        function selectPassword(password) {
            document.getElementById('selectedPassword').value = password;
            document.getElementById('password1234').classList.remove('selected');
            document.getElementById('password4321').classList.remove('selected');
            document.getElementById('password' + password).classList.add('selected');
        }

        function showLoginModal() {
            isLoginMode = true;
            document.getElementById('modalTitle').textContent = 'Login';
            document.getElementById('submitBtn').textContent = 'Login';
            document.getElementById('switchText').innerHTML = 'Don\'t have an account? <a onclick="switchMode()">Register</a>';
            document.getElementById('usernameInput').value = '';
            document.getElementById('selectedPassword').value = '';
            document.getElementById('password1234').classList.remove('selected');
            document.getElementById('password4321').classList.remove('selected');
            document.getElementById('errorMessage').classList.add('hidden');
            document.getElementById('authModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('authModal').classList.remove('show');
        }

        function switchMode() {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                document.getElementById('modalTitle').textContent = 'Login';
                document.getElementById('submitBtn').textContent = 'Login';
                document.getElementById('switchText').innerHTML = 'Don\'t have an account? <a onclick="switchMode()">Register</a>';
            } else {
                document.getElementById('modalTitle').textContent = 'Register';
                document.getElementById('submitBtn').textContent = 'Register';
                document.getElementById('switchText').innerHTML = 'Already have an account? <a onclick="switchMode()">Login</a>';
            }
            document.getElementById('selectedPassword').value = '';
            document.getElementById('password1234').classList.remove('selected');
            document.getElementById('password4321').classList.remove('selected');
            document.getElementById('errorMessage').classList.add('hidden');
        }

        async function submitAuth() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('selectedPassword').value;
            const errorDiv = document.getElementById('errorMessage');

            if (!username) {
                errorDiv.textContent = 'Please enter a username';
                errorDiv.classList.remove('hidden');
                return;
            }

            if (!password) {
                errorDiv.textContent = 'Please select a password (1234 or 4321)';
                errorDiv.classList.remove('hidden');
                return;
            }

            const endpoint = isLoginMode ? '/api/login' : '/api/register';

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    currentUser = data.username;
                    updateAuthUI();
                    closeModal();
                } else {
                    errorDiv.textContent = data.message;
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'Error connecting to server';
                errorDiv.classList.remove('hidden');
            }
        }

        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
                currentUser = null;
                updateAuthUI();
            } catch (error) {
                console.error('Logout error:', error);
            }
        }

        function updateAuthUI() {
            const authSection = document.getElementById('authSection');
            if (currentUser) {
                authSection.innerHTML = `
                    <a href="/" class="btn-physics">Home</a>
                    <a href="/math" class="btn-physics">Math</a>
                    <a href="/economics" class="btn-physics">Economics</a>
                    <div class="user-info">
                        <span>👤 ${currentUser}</span>
                        <button onclick="logout()" class="btn-logout">Logout</button>
                    </div>
                `;
            } else {
                authSection.innerHTML = '<a href="/" class="btn-physics">Home</a><a href="/math" class="btn-physics">Math</a><a href="/economics" class="btn-physics">Economics</a><button onclick="showLoginModal()" class="btn-auth">Login</button>';
            }
        }

        async function checkAuthStatus() {
            try {
                const response = await fetch('/api/current-user');
                const data = await response.json();
                if (data.logged_in) {
                    currentUser = data.username;
                    updateAuthUI();
                }
            } catch (error) {
                console.error('Auth check error:', error);
            }
        }

        // Enter key to submit in modal
        document.getElementById('usernameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitAuth();
            }
        });

        // Close modal on outside click
        document.getElementById('authModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Save/History Functions
        async function trackView(questionId) {
            if (!currentUser || !questionId) return;

            try {
                await fetch('/api/track-view', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question_id: questionId,
                        subject: 'physics'
                    })
                });
            } catch (error) {
                console.error('Error tracking view:', error);
            }
        }

        async function toggleSaveQuestion() {
            if (!currentUser) {
                alert('Please log in to save questions');
                return;
            }

            const saveBtn = document.getElementById('saveBtn');
            const isSaved = saveBtn.textContent.trim() === '⭐';

            try {
                if (isSaved) {
                    // Unsave
                    await fetch('/api/save-question', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            question_id: currentQuestion.question_id,
                            subject: 'physics'
                        })
                    });
                    saveBtn.textContent = '☆';
                    saveBtn.classList.remove('saved');
                } else {
                    // Save
                    await fetch('/api/save-question', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            question_id: currentQuestion.question_id,
                            subject: 'physics'
                        })
                    });
                    saveBtn.textContent = '⭐';
                    saveBtn.classList.add('saved');
                }
            } catch (error) {
                console.error('Error saving/unsaving question:', error);
                alert('Error saving question');
            }
        }

        async function checkIfSaved(questionId) {
            if (!currentUser || !questionId) {
                document.getElementById('saveBtn').style.display = 'none';
                return;
            }

            try {
                const response = await fetch(`/api/is-saved?question_id=${questionId}&subject=physics`);
                const data = await response.json();
                const saveBtn = document.getElementById('saveBtn');
                saveBtn.style.display = 'inline-block';

                if (data.saved) {
                    saveBtn.textContent = '⭐';
                    saveBtn.classList.add('saved');
                } else {
                    saveBtn.textContent = '☆';
                    saveBtn.classList.remove('saved');
                }
            } catch (error) {
                console.error('Error checking if saved:', error);
            }
        }

        async function showHistoryPanel() {
            const panel = document.getElementById('historyPanel');
            const savedPanel = document.getElementById('savedPanel');

            // Hide saved panel if open
            savedPanel.classList.add('hidden');

            // Show history panel
            panel.classList.remove('hidden');

            if (!currentUser) {
                document.getElementById('historyList').innerHTML = '<p style="text-align: center; color: #666;">Please log in to view your history</p>';
                return;
            }

            try {
                const response = await fetch('/api/history?subject=physics&limit=50');
                const data = await response.json();
                const historyList = document.getElementById('historyList');

                if (data.history.length === 0) {
                    historyList.innerHTML = '<p style="text-align: center; color: #666;">No history yet</p>';
                } else {
                    historyList.innerHTML = data.history.map(item => `
                        <div class="history-item" onclick="loadQuestionById('${item.question_id}')">
                            <strong>${item.question_id}</strong><br>
                            <small style="color: #666;">${item.viewed_at}</small>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading history:', error);
                document.getElementById('historyList').innerHTML = '<p style="text-align: center; color: #ef4444;">Error loading history</p>';
            }
        }

        async function showSavedPanel() {
            const panel = document.getElementById('savedPanel');
            const historyPanel = document.getElementById('historyPanel');

            // Hide history panel if open
            historyPanel.classList.add('hidden');

            // Show saved panel
            panel.classList.remove('hidden');

            if (!currentUser) {
                document.getElementById('savedList').innerHTML = '<p style="text-align: center; color: #666;">Please log in to view saved questions</p>';
                return;
            }

            try {
                const response = await fetch('/api/saved?subject=physics');
                const data = await response.json();
                const savedList = document.getElementById('savedList');

                if (data.saved.length === 0) {
                    savedList.innerHTML = '<p style="text-align: center; color: #666;">No saved questions yet</p>';
                } else {
                    savedList.innerHTML = data.saved.map(item => `
                        <div class="saved-item" onclick="loadQuestionById('${item.question_id}')">
                            <strong>${item.question_id}</strong><br>
                            ${item.notes ? `<p style="color: #666; margin-top: 5px;">${item.notes}</p>` : ''}
                            <small style="color: #666;">Saved: ${item.saved_at}</small>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading saved questions:', error);
                document.getElementById('savedList').innerHTML = '<p style="text-align: center; color: #ef4444;">Error loading saved questions</p>';
            }
        }

        function closePanels() {
            document.getElementById('historyPanel').classList.add('hidden');
            document.getElementById('savedPanel').classList.add('hidden');
        }

        async function clearAllData() {
            if (!currentUser) {
                alert('Please log in first');
                return;
            }

            if (!confirm('Are you sure you want to clear ALL your physics history and saved questions? This cannot be undone!')) {
                return;
            }

            try {
                const response = await fetch('/api/clear-all', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subject: 'physics' })
                });

                const data = await response.json();
                if (data.success) {
                    alert('All data cleared successfully!');
                    closePanels();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                console.error('Error clearing data:', error);
                alert('Error clearing data');
            }
        }

        async function loadQuestionById(questionId) {
            // Hide history/saved panels
            document.getElementById('historyPanel').classList.add('hidden');
            document.getElementById('savedPanel').classList.add('hidden');

            // Find question in PHYSICS_QUESTIONS (would need to be passed from backend)
            // For now, just show loading
            document.getElementById('questionContainer').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            try {
                const response = await fetch(`/api/physics/question/${questionId}`);
                const data = await response.json();
                currentQuestion = data;
                displayQuestion(data);
            } catch (error) {
                console.error('Error loading question:', error);
                alert('Error loading question. Please try again.');
            }

            document.getElementById('loading').classList.add('hidden');
        }

        // ============ TIMER SYSTEM ============
        let currentQuestionTimerInterval = null;
        let currentQuestionSeconds = 0;
        let dailySeconds = 0;
        let currentQuestionId = null;
        let currentSubject = 'physics';
        let lastSaveTime = Date.now();

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function startQuestionTimer(questionId) {
            // Stop previous timer if running
            stopQuestionTimer();

            currentQuestionId = questionId;
            currentQuestionSeconds = 0;
            lastSaveTime = Date.now();

            // Load existing time for this question
            if (currentUser) {
                fetch(`/api/time/question/${questionId}?subject=${currentSubject}`)
                    .then(r => r.json())
                    .then(data => {
                        // Don't show the accumulated time, just start from 0 for current session
                    })
                    .catch(err => console.error('Error loading question time:', err));
            }

            // Start counting
            currentQuestionTimerInterval = setInterval(() => {
                currentQuestionSeconds++;
                dailySeconds++;
                document.getElementById('currentQuestionTimer').textContent = formatTime(currentQuestionSeconds);
                document.getElementById('dailyTimer').textContent = formatTime(dailySeconds);

                // Auto-save every 30 seconds
                if (currentQuestionSeconds % 30 === 0) {
                    saveTimers();
                }
            }, 1000);
        }

        function stopQuestionTimer() {
            if (currentQuestionTimerInterval) {
                clearInterval(currentQuestionTimerInterval);
                currentQuestionTimerInterval = null;

                // Save final time
                saveTimers();

                // Reset display
                currentQuestionSeconds = 0;
                document.getElementById('currentQuestionTimer').textContent = '00:00';
            }
        }

        async function saveTimers() {
            if (!currentUser || !currentQuestionId) return;

            const secondsToSave = currentQuestionSeconds;
            if (secondsToSave === 0) return;

            try {
                // Save question time
                await fetch('/api/time/update-question', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question_id: currentQuestionId,
                        subject: currentSubject,
                        seconds: secondsToSave
                    })
                });

                // Save daily time
                await fetch('/api/time/update-daily', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        seconds: secondsToSave
                    })
                });

                // Reset counter after save
                currentQuestionSeconds = 0;
            } catch (error) {
                console.error('Error saving timers:', error);
            }
        }

        async function loadDailyTime() {
            if (!currentUser) return;

            try {
                const response = await fetch('/api/time/daily');
                const data = await response.json();
                dailySeconds = data.time || 0;
                document.getElementById('dailyTimer').textContent = formatTime(dailySeconds);
            } catch (error) {
                console.error('Error loading daily time:', error);
            }
        }

        // Save timers when page unloads
        window.addEventListener('beforeunload', () => {
            if (currentQuestionSeconds > 0) {
                saveTimers();
            }
        });

        // Toggle timer sidebar visibility
        function toggleTimerSidebar() {
            const sidebar = document.getElementById('timerSidebar');
            const toggleBtn = document.getElementById('timerToggleBtn');
            if (sidebar.style.display === 'none' || sidebar.style.display === '') {
                if (currentUser) {
                    sidebar.style.display = 'block';
                    toggleBtn.classList.add('active');
                } else {
                    alert('Please log in to use the timer');
                }
            } else {
                sidebar.style.display = 'none';
                toggleBtn.classList.remove('active');
            }
        }

        // ============ COMMUNITY NOTES SYSTEM ============

        async function loadNotes(questionId, subject) {
            if (!currentUser) {
                document.getElementById('notesSection').style.display = 'none';
                return;
            }

            document.getElementById('notesSection').style.display = 'block';
            document.getElementById('noteInputArea').style.display = 'block';
            document.getElementById('noteLoginPrompt').style.display = 'none';

            try {
                const response = await fetch(`/api/notes/${subject}/${questionId}`);
                const data = await response.json();
                const notesDiv = document.getElementById('questionNotes');

                if (data.notes && data.notes.length > 0) {
                    notesDiv.innerHTML = data.notes.map(note => `
                        <div class="note-item">
                            <div class="note-header">
                                <span class="note-author">${note.username}</span>
                                <span class="note-date">${new Date(note.created_at).toLocaleString()}</span>
                            </div>
                            <div class="note-content">${escapeHtml(note.note)}</div>
                        </div>
                    `).join('');
                } else {
                    notesDiv.innerHTML = '<p style="text-align: center; color: #666; padding: 20px;">No notes yet. Be the first to add one!</p>';
                }
            } catch (error) {
                console.error('Error loading notes:', error);
                document.getElementById('questionNotes').innerHTML = '<p style="text-align: center; color: #ef4444;">Error loading notes</p>';
            }
        }

        async function postNote() {
            if (!currentUser) {
                alert('Please log in to post notes');
                return;
            }

            const noteText = document.getElementById('newNoteText').value.trim();
            if (!noteText) {
                alert('Please enter a note');
                return;
            }

            try {
                const response = await fetch('/api/notes/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question_id: currentQuestion.question_id,
                        subject: currentSubject,
                        note: noteText
                    })
                });

                const data = await response.json();
                if (data.success) {
                    document.getElementById('newNoteText').value = '';
                    loadNotes(currentQuestion.question_id, currentSubject);
                } else {
                    alert('Error posting note: ' + data.message);
                }
            } catch (error) {
                console.error('Error posting note:', error);
                alert('Error posting note');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============ GLOBAL CHAT SYSTEM ============

        let socket = null;

        function initializeSocket() {
            if (!socket && currentUser) {
                socket = io();

                socket.on('new_message', (data) => {
                    addChatMessage(data);
                });

                socket.on('error', (data) => {
                    console.error('Socket error:', data.message);
                    alert('Chat error: ' + data.message);
                });
            }
        }

        async function openChatModal() {
            if (!currentUser) {
                alert('Please log in to use chat');
                return;
            }

            document.getElementById('chatModal').classList.add('show');

            // Initialize socket if not already
            initializeSocket();

            // Load existing messages
            try {
                const response = await fetch('/api/chat/messages');
                const data = await response.json();
                const messagesDiv = document.getElementById('chatMessages');
                messagesDiv.innerHTML = '';

                if (data.messages && data.messages.length > 0) {
                    data.messages.forEach(msg => addChatMessage(msg));
                } else {
                    messagesDiv.innerHTML = '<p style="text-align: center; color: #666;">No messages yet. Start the conversation!</p>';
                }

                // Scroll to bottom
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            } catch (error) {
                console.error('Error loading chat messages:', error);
            }
        }

        function closeChatModal() {
            document.getElementById('chatModal').classList.remove('show');
        }

        function addChatMessage(data) {
            const messagesDiv = document.getElementById('chatMessages');

            // Remove "no messages" placeholder if it exists
            const placeholder = messagesDiv.querySelector('p');
            if (placeholder) {
                placeholder.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = 'chat-message';
            messageDiv.innerHTML = `
                <div class="chat-message-header">
                    <span class="chat-username">${escapeHtml(data.username)}</span>
                    <span class="chat-timestamp">${new Date(data.created_at).toLocaleString()}</span>
                </div>
                <div class="chat-text">${escapeHtml(data.message)}</div>
            `;

            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function sendChatMessage() {
            if (!currentUser) {
                alert('Please log in to send messages');
                return;
            }

            const input = document.getElementById('chatInput');
            const message = input.value.trim();

            if (!message) {
                return;
            }

            // Send via socket
            socket.emit('send_message', { message: message });
            input.value = '';
        }

        // Enter key to send message
        document.addEventListener('DOMContentLoaded', () => {
            const chatInput = document.getElementById('chatInput');
            if (chatInput) {
                chatInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        sendChatMessage();
                    }
                });
            }
        });

        // Close modal on outside click
        document.addEventListener('DOMContentLoaded', () => {
            const chatModal = document.getElementById('chatModal');
            if (chatModal) {
                chatModal.addEventListener('click', (e) => {
                    if (e.target === chatModal) {
                        closeChatModal();
                    }
                });
            }
        });

        // Update displayQuestion to load notes and start timer
        const originalDisplayQuestion = displayQuestion;
        displayQuestion = function(question) {
            originalDisplayQuestion(question);
            if (currentUser) {
                document.getElementById('timerSidebar').style.display = 'block';
                startQuestionTimer(question.question_id);
                loadNotes(question.question_id, currentSubject);
            }
        };

        // Update updateAuthUI to show/hide timer
        const originalUpdateAuthUI = updateAuthUI;
        updateAuthUI = function() {
            originalUpdateAuthUI();
            const timerToggleBtn = document.getElementById('timerToggleBtn');
            if (currentUser) {
                document.getElementById('timerSidebar').style.display = 'block';
                timerToggleBtn.classList.add('active');
                loadDailyTime();
            } else {
                document.getElementById('timerSidebar').style.display = 'none';
                timerToggleBtn.classList.remove('active');
                stopQuestionTimer();
            }
        };

        // ============ THEME TOGGLE ============

        function setTheme(theme) {
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.classList.remove('dark-mode');
                localStorage.setItem('theme', 'light');
            }
        }

        // Load saved theme on page load (default to dark)
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.classList.remove('dark-mode');
        } else {
            document.body.classList.add('dark-mode');
        }

        // Initialize
        checkAuthStatus();
        loadTopics();
        document.getElementById('noQuestion').classList.remove('hidden');
    </script>
</body>
</html>
