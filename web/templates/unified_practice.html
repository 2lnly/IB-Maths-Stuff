<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB Practice - Unified Platform</title>
    <style>
        /* ===== BLACK PROFESSIONAL THEME ===== */
        :root {
            /* Base colors */
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #2a2a2a;
            --bg-hover: #333333;

            /* Accent colors per subject */
            --accent-math: #d4af37;
            --accent-physics: #4a90e2;
            --accent-economics: #9b59b6;
            --accent-current: var(--accent-math);

            /* Text colors */
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --text-muted: #666666;

            /* Interactive */
            --border-color: #333333;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== ANIMATED BACKGROUND ===== */
        .bg-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-line {
            position: absolute;
            width: 1px;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent,
                var(--accent-current) 50%,
                transparent
            );
            opacity: 0.1;
            animation: lineMove 15s infinite linear;
        }

        .bg-line:nth-child(1) { left: 10%; animation-delay: 0s; }
        .bg-line:nth-child(2) { left: 30%; animation-delay: 2s; }
        .bg-line:nth-child(3) { left: 50%; animation-delay: 4s; }
        .bg-line:nth-child(4) { left: 70%; animation-delay: 6s; }
        .bg-line:nth-child(5) { left: 90%; animation-delay: 8s; }

        @keyframes lineMove {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .geometric-shape {
            position: fixed;
            opacity: 0.03;
            animation: rotate 30s infinite linear;
            pointer-events: none;
        }

        .shape-hexagon {
            width: 200px;
            height: 200px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background: var(--accent-current);
            top: 20%;
            right: 10%;
        }

        .shape-triangle {
            width: 0;
            height: 0;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
            border-bottom: 173px solid var(--accent-current);
            bottom: 15%;
            left: 15%;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ===== MAIN LAYOUT ===== */
        .app-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-current);
        }

        .subject-tabs {
            display: flex;
            gap: 1rem;
        }

        .subject-tab {
            padding: 0.5rem 1.5rem;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
        }

        .subject-tab.active {
            background: var(--accent-current);
            color: var(--bg-primary);
            border-color: var(--accent-current);
        }

        .user-info {
            color: var(--text-secondary);
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex: 1;
            gap: 2rem;
            padding: 2rem;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
        }

        /* Filters Panel */
        .filters-panel {
            width: 300px;
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
            height: fit-content;
            position: sticky;
            top: 2rem;
        }

        .filters-panel h3 {
            margin-bottom: 1.5rem;
            color: var(--accent-current);
        }

        .filter-group {
            margin-bottom: 1.5rem;
        }

        .filter-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 0.5rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .checkboxes-container {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.5rem;
            max-height: 200px;
            overflow-y: auto;
        }

        .checkbox-group {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.5rem;
            background: var(--bg-tertiary);
        }

        .checkbox-item {
            padding: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .checkbox-item:hover {
            background: var(--bg-hover);
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .checkbox-item label {
            cursor: pointer;
            flex: 1;
            user-select: none;
        }

        .year-range {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .year-range input[type="number"] {
            width: 80px;
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--accent-current);
            color: var(--bg-primary);
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        /* Question Display Area */
        .question-area {
            flex: 1;
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 2rem;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .question-meta {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .question-actions {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            padding: 0.5rem 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s;
        }

        .action-btn:hover {
            background: var(--bg-hover);
        }

        .question-display {
            margin-top: 2rem;
        }

        .question-image {
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 1rem;
            transition: filter 0.3s;
        }

        .question-image.inverted {
            filter: invert(1) hue-rotate(180deg);
        }

        .question-metadata {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        .question-metadata .meta-item {
            display: inline-block;
            margin-right: 1rem;
            padding: 0.25rem 0.5rem;
            background: var(--bg-secondary);
            border-radius: 4px;
        }

        /* Modal styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--accent-current);
        }

        .modal-header h3 {
            margin: 0;
            color: var(--accent-current);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .modal-close:hover {
            background: var(--bg-hover);
        }

        .modal-body {
            color: var(--text-primary);
        }

        .history-item, .saved-item {
            padding: 1rem;
            background: var(--bg-secondary);
            border-radius: 8px;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .history-item:hover, .saved-item:hover {
            background: var(--bg-tertiary);
            transform: translateX(5px);
        }

        .item-id {
            font-weight: bold;
            color: var(--accent-current);
        }

        .item-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .note-item {
            padding: 1rem;
            background: var(--bg-secondary);
            border-radius: 8px;
            margin-bottom: 0.75rem;
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .note-author {
            font-weight: bold;
            color: var(--accent-current);
        }

        .note-date {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .note-text {
            color: var(--text-primary);
        }

        .note-input-area {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .note-input-area textarea {
            width: 100%;
            min-height: 100px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem;
            color: var(--text-primary);
            font-family: inherit;
            resize: vertical;
        }

        .note-input-area textarea:focus {
            outline: none;
            border-color: var(--accent-current);
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .modal-actions button {
            flex: 1;
        }

        /* Chat modal specific */
        .chat-modal .modal-content {
            max-width: 800px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 2rem;
        }

        /* Browse Mode */
        .browse-container {
            padding: 2rem;
        }

        .browse-breadcrumb {
            margin-bottom: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .browse-breadcrumb span {
            cursor: pointer;
            color: var(--accent-current);
        }

        .browse-breadcrumb span:hover {
            text-decoration: underline;
        }

        .browse-items {
            display: grid;
            gap: 0.75rem;
        }

        .browse-item {
            padding: 1rem;
            background: var(--bg-secondary);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .browse-item:hover {
            background: var(--bg-tertiary);
            transform: translateX(5px);
        }

        .browse-item-name {
            font-weight: 500;
        }

        .browse-item-count {
            color: var(--accent-current);
            font-size: 0.9rem;
        }

        /* Generate Paper Mode */
        .generate-container {
            padding: 2rem;
        }

        .generate-controls {
            background: var(--bg-secondary);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .generate-controls input {
            padding: 0.5rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            width: 150px;
        }

        .generated-paper {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .paper-question {
            background: var(--bg-secondary);
            padding: 1.5rem;
            border-radius: 8px;
            border-left: 4px solid var(--accent-current);
        }

        .paper-actions {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
        }

        @media print {
            .filters-panel, .side-panel, .timer-container, button, .generate-controls {
                display: none !important;
            }
            .paper-question {
                page-break-inside: avoid;
            }
        }

        .question-text {
            line-height: 1.6;
            color: var(--text-primary);
        }

        .timer-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 1rem;
            background: var(--bg-tertiary);
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .timer-display {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-current);
        }

        .timer-display.hidden {
            visibility: hidden;
        }

        .timer-toggle {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
        }

        .timer-toggle:hover {
            background: var(--bg-hover);
        }

        /* Side Panel */
        .side-panel {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .panel-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .panel-card h4 {
            margin-bottom: 1rem;
            color: var(--accent-current);
        }

        .chat-messages {
            height: 300px;
            overflow-y: auto;
            margin-bottom: 1rem;
        }

        .chat-message {
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            background: var(--bg-tertiary);
            border-radius: 6px;
        }

        .chat-message .username {
            font-weight: 600;
            color: var(--accent-current);
        }

        .chat-input {
            display: flex;
            gap: 0.5rem;
        }

        .chat-input input {
            flex: 1;
            padding: 0.5rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
        }

        /* Utility */
        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-current);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-lines">
        <div class="bg-line"></div>
        <div class="bg-line"></div>
        <div class="bg-line"></div>
        <div class="bg-line"></div>
        <div class="bg-line"></div>
    </div>
    <div class="geometric-shape shape-hexagon"></div>
    <div class="geometric-shape shape-triangle"></div>

    <!-- Main App Container -->
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">IB Practice Hub</div>

            <div class="subject-tabs">
                <button class="subject-tab active" data-subject="math">Mathematics AA HL</button>
                <button class="subject-tab" data-subject="physics">Physics HL</button>
                <button class="subject-tab" data-subject="economics">Economics SL</button>
            </div>

            <div class="user-info">
                <span id="username">Guest</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Filters Panel -->
            <aside class="filters-panel">
                <h3>Filters</h3>

                <!-- Paper Selection -->
                <div class="filter-group">
                    <label>Paper</label>
                    <div id="papersCheckboxes" class="checkboxes-container">
                        <div class="checkbox-item">
                            <input type="checkbox" id="paper-Paper1" value="Paper1" checked>
                            <label for="paper-Paper1">Paper 1</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="paper-Paper2" value="Paper2">
                            <label for="paper-Paper2">Paper 2</label>
                        </div>
                        <div class="checkbox-item" id="paper3Option">
                            <input type="checkbox" id="paper-Paper3" value="Paper3">
                            <label for="paper-Paper3">Paper 3</label>
                        </div>
                    </div>
                </div>

                <!-- Topics -->
                <div class="filter-group">
                    <label>Topics</label>
                    <div class="checkbox-group" id="topicsCheckboxes">
                        <!-- Dynamically populated -->
                    </div>
                </div>

                <!-- Subtopics -->
                <div class="filter-group" id="subtopicsGroup">
                    <label>Subtopics</label>
                    <div class="checkbox-group" id="subtopicsCheckboxes">
                        <!-- Dynamically populated -->
                    </div>
                </div>

                <!-- Year Range -->
                <div class="filter-group">
                    <label>Year Range</label>
                    <div class="year-range">
                        <input type="number" id="yearMin" placeholder="2010" min="2010" max="2025" value="2010">
                        <span>to</span>
                        <input type="number" id="yearMax" placeholder="2025" min="2010" max="2025" value="2025">
                    </div>
                </div>

                <!-- Action Buttons -->
                <button class="btn" id="randomBtn">Random Question</button>
                <button class="btn btn-secondary" id="browseBtn">Browse Mode</button>
                <button class="btn btn-secondary" id="generateBtn">Generate Paper</button>
            </aside>

            <!-- Question Display Area -->
            <section class="question-area">
                <div class="question-header">
                    <div class="question-meta">
                        <span id="questionId">No question loaded</span>
                        <div id="questionMetadata" class="question-metadata"></div>
                    </div>
                    <div class="question-actions">
                        <button class="action-btn" id="showAnswerBtn">Show Answer</button>
                        <button class="action-btn" id="invertColorsBtn" title="Invert image colors (better for dark theme)">
                            🔄 Invert Colors
                        </button>
                        <button class="action-btn" id="saveBtn">💾 Save</button>
                        <button class="action-btn" id="notesBtn">📝 Notes</button>
                    </div>
                </div>

                <div class="timer-container">
                    <div class="timer-display" id="timer">00:00:00</div>
                    <button class="timer-toggle" id="timerToggle" title="Hide timer">👁️</button>
                </div>

                <div class="question-display" id="questionDisplay">
                    <p class="loading">Select filters and click "Random Question" to start</p>
                </div>

                <!-- Browse Mode Display -->
                <div class="browse-container hidden" id="browseContainer">
                    <div class="browse-breadcrumb" id="browseBreadcrumb"></div>
                    <div class="browse-items" id="browseItems"></div>
                </div>

                <!-- Generate Paper Display -->
                <div class="generate-container hidden" id="generateContainer">
                    <div class="generate-controls">
                        <p>Questions matching filters: <strong id="matchingCount">0</strong></p>
                        <input type="number" id="paperQuestionsCount" min="1" max="50" value="10" placeholder="Number of questions">
                        <button class="btn" id="generatePaperBtn">Generate Paper</button>
                    </div>
                    <div id="generatedPaper" class="generated-paper"></div>
                </div>

                <div class="question-display hidden" id="answerDisplay">
                    <!-- Answer will be displayed here -->
                </div>
            </section>

            <!-- Side Panel (Chat & History) -->
            <aside class="side-panel">
                <!-- Global Chat -->
                <div class="panel-card">
                    <h4>Global Chat</h4>
                    <div class="chat-messages" id="chatMessages">
                        <!-- Messages load here -->
                    </div>
                    <div class="chat-input">
                        <input type="text" id="chatInput" placeholder="Type a message...">
                        <button class="action-btn" id="sendChatBtn">Send</button>
                    </div>
                </div>

                <!-- History & Saved -->
                <div class="panel-card">
                    <h4>Rewind</h4>
                    <button class="btn btn-secondary" id="historyBtn">History</button>
                    <button class="btn btn-secondary" id="savedBtn">Saved Questions</button>
                </div>
            </aside>
        </main>
    </div>

    <!-- Chat Modal -->
    <div id="chatModal" class="modal-overlay chat-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Global Chat</h3>
                <button class="modal-close" onclick="closeChatModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="chat-messages" id="modalChatMessages" style="max-height: 400px; overflow-y: auto; margin-bottom: 1rem;">
                    <!-- Messages load here -->
                </div>
                <div class="chat-input">
                    <input type="text" id="modalChatInput" placeholder="Type a message..." style="flex: 1; padding: 0.75rem; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary);">
                    <button class="action-btn" id="modalSendChatBtn" style="margin-left: 0.5rem;">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Question History</h3>
                <button class="modal-close" onclick="closeHistoryModal()">&times;</button>
            </div>
            <div class="modal-body" id="historyContent">
                <p class="empty-state">Loading history...</p>
            </div>
        </div>
    </div>

    <!-- Saved Questions Modal -->
    <div id="savedModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Saved Questions</h3>
                <button class="modal-close" onclick="closeSavedModal()">&times;</button>
            </div>
            <div class="modal-body" id="savedContent">
                <p class="empty-state">Loading saved questions...</p>
            </div>
        </div>
    </div>

    <!-- Notes Modal -->
    <div id="notesModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Community Notes</h3>
                <button class="modal-close" onclick="closeNotesModal()">&times;</button>
            </div>
            <div class="modal-body" id="notesContent">
                <p class="empty-state">Loading notes...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        // ===== APP STATE =====
        const appState = {
            currentSubject: 'math',
            currentQuestion: null,
            topicsData: null, // Store full topics structure for filtering
            selectedPapers: [],
            selectedTopics: [],
            selectedSubtopics: [],
            yearMin: 2010,
            yearMax: 2025,
            timerSeconds: 0,
            timerInterval: null,
        };

        // ===== COLOR MANAGEMENT =====
        const subjectColors = {
            math: '#d4af37',
            physics: '#4a90e2',
            economics: '#9b59b6'
        };

        function updateThemeColor() {
            document.documentElement.style.setProperty('--accent-current', subjectColors[appState.currentSubject]);
        }

        // ===== SUBJECT SWITCHER =====
        document.querySelectorAll('.subject-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                // Update active tab
                document.querySelectorAll('.subject-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                // Update state
                appState.currentSubject = tab.dataset.subject;
                updateThemeColor();

                // Reload subject data
                loadSubjectInfo();
            });
        });

        // ===== API CALLS =====
        async function loadSubjectInfo() {
            try {
                console.log('Loading subject info for:', appState.currentSubject);
                const response = await fetch(`/api/subject/${appState.currentSubject}/info`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                console.log('Subject info loaded:', data);

                // Populate topics
                populateTopics(data.topics);

                // Update subject-specific UI
                if (appState.currentSubject === 'economics') {
                    document.getElementById('subtopicsGroup').style.display = 'none';
                    // Hide Paper 3 for economics
                    const paper3Div = document.getElementById('paper3Option');
                    if (paper3Div) paper3Div.style.display = 'none';
                } else {
                    document.getElementById('subtopicsGroup').style.display = 'block';
                    // Show Paper 3 for math/physics
                    const paper3Div = document.getElementById('paper3Option');
                    if (paper3Div) paper3Div.style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading subject info:', error);
                alert('Failed to load subject info. Check console for details.');
            }
        }

        function populateTopics(topicsData) {
            console.log('Populating topics with data:', topicsData);

            // Store topics data in appState for later use
            appState.topicsData = topicsData;

            const topicsContainer = document.getElementById('topicsCheckboxes');

            if (!topicsContainer) {
                console.error('Topics container not found!');
                return;
            }

            topicsContainer.innerHTML = '';

            // Get all unique topics across papers
            const allTopics = new Set();
            Object.values(topicsData).forEach(paperTopics => {
                Object.keys(paperTopics).forEach(topic => allTopics.add(topic));
            });

            console.log(`Found ${allTopics.size} unique topics`);

            allTopics.forEach(topic => {
                const div = document.createElement('div');
                div.className = 'checkbox-item';
                div.innerHTML = `
                    <input type="checkbox" id="topic-${topic}" value="${topic}">
                    <label for="topic-${topic}">${topic.replace(/_/g, ' ')}</label>
                `;
                topicsContainer.appendChild(div);

                // Add event listener
                div.querySelector('input').addEventListener('change', updateSubtopics);
            });

            // Initialize empty subtopics
            updateSubtopics();
        }

        function updateSubtopics() {
            // Get selected topics
            const selectedTopics = Array.from(document.querySelectorAll('#topicsCheckboxes input:checked'))
                .map(cb => cb.value);

            const subtopicsContainer = document.getElementById('subtopicsCheckboxes');
            if (!subtopicsContainer) return;

            subtopicsContainer.innerHTML = '';

            // If no topics selected, show nothing
            if (selectedTopics.length === 0 || !appState.topicsData) {
                return;
            }

            // Get all subtopics for selected topics across all papers
            const allSubtopics = new Set();
            Object.values(appState.topicsData).forEach(paperTopics => {
                selectedTopics.forEach(topic => {
                    if (paperTopics[topic]) {
                        paperTopics[topic].forEach(subtopic => allSubtopics.add(subtopic));
                    }
                });
            });

            // Populate subtopics checkboxes
            allSubtopics.forEach(subtopic => {
                const div = document.createElement('div');
                div.className = 'checkbox-item';
                div.innerHTML = `
                    <input type="checkbox" id="subtopic-${subtopic}" value="${subtopic}">
                    <label for="subtopic-${subtopic}">${subtopic.replace(/_/g, ' ')}</label>
                `;
                subtopicsContainer.appendChild(div);
            });

            console.log(`Found ${allSubtopics.size} subtopics for selected topics`);
        }

        async function loadRandomQuestion() {
            console.log('Loading random question for:', appState.currentSubject);

            // Build filter params
            const params = new URLSearchParams();

            // Add selected papers (support multiple)
            const selectedPapers = Array.from(document.querySelectorAll('#papersCheckboxes input:checked'))
                .map(cb => cb.value);
            if (selectedPapers.length > 0) {
                params.append('papers', selectedPapers.join(','));
            }

            // Add selected topics
            const selectedTopics = Array.from(document.querySelectorAll('#topicsCheckboxes input:checked'))
                .map(cb => cb.value);
            if (selectedTopics.length > 0) {
                params.append('topics', selectedTopics.join(','));
            }

            // Add selected subtopics
            const selectedSubtopics = Array.from(document.querySelectorAll('#subtopicsCheckboxes input:checked'))
                .map(cb => cb.value);
            if (selectedSubtopics.length > 0) {
                params.append('subtopics', selectedSubtopics.join(','));
            }

            // Add year range
            params.append('year_min', document.getElementById('yearMin').value);
            params.append('year_max', document.getElementById('yearMax').value);

            console.log('Filters:', params.toString());

            try {
                const url = `/api/subject/${appState.currentSubject}/random?${params}`;
                console.log('Fetching:', url);

                const response = await fetch(url);

                if (!response.ok) {
                    if (response.status === 404) {
                        alert('No questions found matching your filters. Try:\n- Selecting different papers\n- Choosing fewer/different topics\n- Expanding year range');
                        return;
                    }
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                console.log('Question data received:', data);

                if (data.question) {
                    await displayQuestion(data.question);
                } else if (data.error) {
                    alert('Error: ' + data.error);
                } else {
                    alert('No question returned from server');
                }
            } catch (error) {
                console.error('Error loading question:', error);
                alert('Failed to load question. Check console for details.');
            }
        }

        async function displayQuestion(question) {
            appState.currentQuestion = question;

            // Update question ID display
            document.getElementById('questionId').textContent = question.question_id;

            // Display metadata
            const metadataDiv = document.getElementById('questionMetadata');
            metadataDiv.innerHTML = `
                <span class="meta-item">📚 ${question.primary_topic || 'N/A'}</span>
                <span class="meta-item">📖 ${question.primary_subtopic || 'N/A'}</span>
                <span class="meta-item">📅 ${question.year || 'N/A'}</span>
                <span class="meta-item">📄 ${question.paper || 'N/A'}</span>
            `;

            // Get full display data
            const response = await fetch(`/api/subject/${appState.currentSubject}/question/${question.question_id}`);
            const displayData = await response.json();

            // Store display data for answer access
            appState.currentQuestionData = displayData;

            const displayArea = document.getElementById('questionDisplay');
            displayArea.innerHTML = '';

            if (displayData.mode === 'image') {
                // Display images with inversion ON by default
                displayData.images.forEach(imgName => {
                    const img = document.createElement('img');
                    img.src = `/api/unified/image/${appState.currentSubject}/${displayData.relative_path}/${imgName}`;
                    img.className = 'question-image inverted'; // Default to inverted
                    displayArea.appendChild(img);
                });
            } else {
                // Display text
                const textDiv = document.createElement('div');
                textDiv.className = 'question-text';
                textDiv.innerHTML = `
                    <p><strong>Part A:</strong></p>
                    <p>${displayData.text.part_a || displayData.text.full_text}</p>
                    ${displayData.text.part_b ? `<p><strong>Part B:</strong></p><p>${displayData.text.part_b}</p>` : ''}
                `;
                displayArea.appendChild(textDiv);
            }

            // Update save button state
            checkIfSaved();

            // Start timer
            startTimer();
        }

        function showAnswer() {
            if (!appState.currentQuestionData) {
                alert('Load a question first!');
                return;
            }

            const displayArea = document.getElementById('questionDisplay');
            const data = appState.currentQuestionData;

            // Add separator
            const separator = document.createElement('div');
            separator.style.margin = '30px 0';
            separator.style.borderTop = '3px solid var(--accent-current)';
            separator.style.paddingTop = '20px';
            separator.innerHTML = '<h3 style="color: var(--accent-current); margin-bottom: 15px;">ANSWER:</h3>';
            displayArea.appendChild(separator);

            if (data.mode === 'image' && data.answer_images && data.answer_images.length > 0) {
                // Display answer images with inversion ON by default
                data.answer_images.forEach(imgName => {
                    const img = document.createElement('img');
                    img.src = `/api/unified/image/${appState.currentSubject}/${data.relative_path}/${imgName}`;
                    img.className = 'question-image inverted'; // Default to inverted
                    displayArea.appendChild(img);
                });
            } else if (data.text && data.text.markscheme) {
                // Display text markscheme
                const textDiv = document.createElement('div');
                textDiv.className = 'question-text';
                textDiv.style.backgroundColor = 'var(--bg-tertiary)';
                textDiv.style.padding = '15px';
                textDiv.style.borderRadius = '8px';
                textDiv.innerHTML = `<pre style="white-space: pre-wrap;">${data.text.markscheme}</pre>`;
                displayArea.appendChild(textDiv);
            } else {
                alert('No answer available for this question');
            }
        }

        // ===== TIMER =====
        function startTimer() {
            stopTimer();
            appState.timerSeconds = 0;
            updateTimerDisplay();

            appState.timerInterval = setInterval(() => {
                appState.timerSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            if (appState.timerInterval) {
                clearInterval(appState.timerInterval);
                appState.timerInterval = null;
            }
        }

        function updateTimerDisplay() {
            const hours = Math.floor(appState.timerSeconds / 3600);
            const minutes = Math.floor((appState.timerSeconds % 3600) / 60);
            const seconds = appState.timerSeconds % 60;

            document.getElementById('timer').textContent =
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // ===== CHAT FUNCTIONALITY =====
        const socket = io();

        socket.on('receive_message', (data) => {
            const messageHTML = `<span class="username">${data.username}:</span> ${data.message}`;

            // Add to sidebar chat
            const sidebarDiv = document.getElementById('chatMessages');
            const sidebarMsg = document.createElement('div');
            sidebarMsg.className = 'chat-message';
            sidebarMsg.innerHTML = messageHTML;
            sidebarDiv.appendChild(sidebarMsg);
            sidebarDiv.scrollTop = sidebarDiv.scrollHeight;

            // Add to modal chat if it exists
            const modalDiv = document.getElementById('modalChatMessages');
            if (modalDiv) {
                const modalMsg = document.createElement('div');
                modalMsg.className = 'chat-message';
                modalMsg.innerHTML = messageHTML;
                modalDiv.appendChild(modalMsg);
                modalDiv.scrollTop = modalDiv.scrollHeight;
            }
        });

        document.getElementById('sendChatBtn').addEventListener('click', () => {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (message) {
                socket.emit('send_message', { message });
                input.value = '';
            }
        });

        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('sendChatBtn').click();
            }
        });

        // Load chat history
        fetch('/api/chat/messages')
            .then(r => r.json())
            .then(data => {
                const messagesDiv = document.getElementById('chatMessages');
                data.messages.forEach(msg => {
                    const messageEl = document.createElement('div');
                    messageEl.className = 'chat-message';
                    messageEl.innerHTML = `<span class="username">${msg.username}:</span> ${msg.message}`;
                    messagesDiv.appendChild(messageEl);
                });
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });

        // ===== IMAGE INVERSION =====
        document.getElementById('invertColorsBtn').addEventListener('click', () => {
            const images = document.querySelectorAll('.question-image');
            images.forEach(img => img.classList.toggle('inverted'));
        });

        // ===== TIMER TOGGLE =====
        let timerVisible = true;
        document.getElementById('timerToggle').addEventListener('click', () => {
            const timer = document.getElementById('timer');
            const toggleBtn = document.getElementById('timerToggle');
            timerVisible = !timerVisible;

            if (timerVisible) {
                timer.classList.remove('hidden');
                toggleBtn.textContent = '👁️';
                toggleBtn.title = 'Hide timer';
            } else {
                timer.classList.add('hidden');
                toggleBtn.textContent = '🚫';
                toggleBtn.title = 'Show timer';
            }
        });

        // ===== MODAL FUNCTIONS =====
        function openChatModal() {
            document.getElementById('chatModal').classList.add('active');
            // Copy messages from sidebar to modal
            const sidebarMessages = document.getElementById('chatMessages').innerHTML;
            document.getElementById('modalChatMessages').innerHTML = sidebarMessages;
            // Focus input
            document.getElementById('modalChatInput').focus();
        }

        function closeChatModal() {
            document.getElementById('chatModal').classList.remove('active');
        }

        async function openHistoryModal() {
            document.getElementById('historyModal').classList.add('active');
            const content = document.getElementById('historyContent');
            content.innerHTML = '<p class="empty-state">Loading history...</p>';

            try {
                const response = await fetch(`/api/history?subject=${appState.currentSubject}&limit=50`);
                const data = await response.json();

                if (data.history.length === 0) {
                    content.innerHTML = '<p class="empty-state">No history yet. Start practicing!</p>';
                    return;
                }

                content.innerHTML = data.history.map(item => `
                    <div class="history-item" onclick="loadQuestionById('${item.question_id}')">
                        <div class="item-id">${item.question_id}</div>
                        <div class="item-meta">
                            ${item.paper ? item.paper + ' • ' : ''}${item.topic || ''} ${item.subtopic ? ' ' + item.subtopic : ''} ${item.year ? ' • ' + item.year : ''}
                            ${item.time_spent ? ' • ' + formatTime(item.time_spent) : ''}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                content.innerHTML = '<p class="empty-state">Error loading history</p>';
            }
        }

        function closeHistoryModal() {
            document.getElementById('historyModal').classList.remove('active');
        }

        async function openSavedModal() {
            document.getElementById('savedModal').classList.add('active');
            const content = document.getElementById('savedContent');
            content.innerHTML = '<p class="empty-state">Loading saved questions...</p>';

            try {
                const response = await fetch(`/api/saved?subject=${appState.currentSubject}`);
                const data = await response.json();

                if (data.saved.length === 0) {
                    content.innerHTML = '<p class="empty-state">No saved questions yet. Click Save on a question!</p>';
                    return;
                }

                content.innerHTML = data.saved.map(item => `
                    <div class="saved-item" onclick="loadQuestionById('${item.question_id}')">
                        <div class="item-id">${item.question_id}</div>
                        <div class="item-meta">
                            ${item.paper ? item.paper + ' • ' : ''}${item.topic || ''} ${item.subtopic ? ' ' + item.subtopic : ''} ${item.year ? ' • ' + item.year : ''}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                content.innerHTML = '<p class="empty-state">Error loading saved questions</p>';
            }
        }

        function closeSavedModal() {
            document.getElementById('savedModal').classList.remove('active');
        }

        async function openNotesModal() {
            if (!appState.currentQuestion) {
                alert('Load a question first!');
                return;
            }

            document.getElementById('notesModal').classList.add('active');
            const content = document.getElementById('notesContent');
            content.innerHTML = '<p class="empty-state">Loading notes...</p>';

            try {
                const response = await fetch(`/api/notes/${appState.currentSubject}/${appState.currentQuestion.question_id}`);
                const data = await response.json();

                let notesHTML = '';
                if (data.notes && data.notes.length > 0) {
                    notesHTML = data.notes.map(note => `
                        <div class="note-item">
                            <div class="note-header">
                                <span class="note-author">${note.username}</span>
                                <span class="note-date">${new Date(note.created_at).toLocaleDateString()}</span>
                            </div>
                            <div class="note-text">${note.note}</div>
                        </div>
                    `).join('');
                } else {
                    notesHTML = '<p class="empty-state">No notes yet. Be the first to add one!</p>';
                }

                content.innerHTML = `
                    ${notesHTML}
                    <div class="note-input-area">
                        <h4>Add a Note</h4>
                        <textarea id="noteTextarea" placeholder="Share your thoughts, tips, or solutions..."></textarea>
                        <div class="modal-actions">
                            <button class="btn btn-secondary" onclick="closeNotesModal()">Cancel</button>
                            <button class="btn btn-primary" onclick="submitNote()">Submit Note</button>
                        </div>
                    </div>
                `;
            } catch (error) {
                content.innerHTML = '<p class="empty-state">Error loading notes</p>';
            }
        }

        function closeNotesModal() {
            document.getElementById('notesModal').classList.remove('active');
        }

        async function submitNote() {
            const textarea = document.getElementById('noteTextarea');
            const note = textarea.value.trim();

            if (!note) {
                alert('Please enter a note');
                return;
            }

            try {
                const response = await fetch('/api/notes/add', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        question_id: appState.currentQuestion.question_id,
                        subject: appState.currentSubject,
                        note: note
                    })
                });

                const data = await response.json();
                if (data.success) {
                    closeNotesModal();
                    alert('Note added successfully!');
                } else {
                    alert(data.message || 'Error adding note');
                }
            } catch (error) {
                alert('Error adding note');
            }
        }

        // ===== SAVE/UNSAVE QUESTION =====
        let questionIsSaved = false;

        async function checkIfSaved() {
            if (!appState.currentQuestion) return;

            try {
                const response = await fetch(`/api/saved?subject=${appState.currentSubject}`);
                const data = await response.json();
                questionIsSaved = data.saved.some(item => item.question_id === appState.currentQuestion.question_id);

                const saveBtn = document.getElementById('saveBtn');
                saveBtn.textContent = questionIsSaved ? '✅ Saved' : '💾 Save';
            } catch (error) {
                console.error('Error checking saved status:', error);
            }
        }

        async function toggleSaveQuestion() {
            if (!appState.currentQuestion) {
                alert('Load a question first!');
                return;
            }

            try {
                if (questionIsSaved) {
                    // Unsave
                    const response = await fetch('/api/save-question', {
                        method: 'DELETE',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            question_id: appState.currentQuestion.question_id,
                            subject: appState.currentSubject
                        })
                    });
                    const data = await response.json();
                    if (data.success) {
                        questionIsSaved = false;
                        document.getElementById('saveBtn').textContent = '💾 Save';
                    }
                } else {
                    // Save
                    const response = await fetch('/api/save-question', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            question_id: appState.currentQuestion.question_id,
                            subject: appState.currentSubject
                        })
                    });
                    const data = await response.json();
                    if (data.success) {
                        questionIsSaved = true;
                        document.getElementById('saveBtn').textContent = '✅ Saved';
                    }
                }
            } catch (error) {
                alert('Error saving question');
            }
        }

        // ===== LOAD QUESTION BY ID =====
        async function loadQuestionById(questionId) {
            try {
                // Close any open modals
                closeHistoryModal();
                closeSavedModal();

                // Find the question in current subject data
                const response = await fetch(`/api/subject/${appState.currentSubject}/question/${questionId}`);
                if (!response.ok) {
                    throw new Error('Question not found');
                }

                // Create a question object from the API response
                const displayData = await response.json();
                const question = {
                    question_id: questionId,
                    primary_topic: displayData.topic || displayData.primary_topic || displayData.metadata?.topic,
                    primary_subtopic: displayData.subtopic || displayData.primary_subtopic || displayData.metadata?.subtopic,
                    year: displayData.year || displayData.metadata?.year,
                    paper: displayData.paper || displayData.metadata?.paper
                };

                await displayQuestion(question);
            } catch (error) {
                alert('Error loading question: ' + error.message);
            }
        }

        // ===== UTILITY FUNCTIONS =====
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${String(secs).padStart(2, '0')}`;
        }

        // ===== MODE SWITCHING =====
        let currentMode = 'random'; // 'random', 'browse', 'generate'

        function switchMode(mode) {
            currentMode = mode;

            // Hide all mode displays
            document.getElementById('questionDisplay').classList.add('hidden');
            document.getElementById('browseContainer').classList.add('hidden');
            document.getElementById('generateContainer').classList.add('hidden');

            // Show selected mode
            if (mode === 'random') {
                document.getElementById('questionDisplay').classList.remove('hidden');
            } else if (mode === 'browse') {
                document.getElementById('browseContainer').classList.remove('hidden');
                enterBrowseMode();
            } else if (mode === 'generate') {
                document.getElementById('generateContainer').classList.remove('hidden');
                enterGenerateMode();
            }
        }

        // ===== BROWSE MODE =====
        let browseState = {
            level: 'topics',
            selectedTopic: null,
            selectedSubtopic: null,
            selectedYear: null
        };

        async function enterBrowseMode() {
            browseState = { level: 'topics', selectedTopic: null, selectedSubtopic: null, selectedYear: null };
            await renderBrowseLevel();
        }

        async function renderBrowseLevel() {
            const container = document.getElementById('browseItems');
            const breadcrumb = document.getElementById('browseBreadcrumb');

            // Update breadcrumb
            let breadcrumbHTML = '<span onclick="browseReset()">Home</span>';
            if (browseState.selectedTopic) {
                breadcrumbHTML += ` > <span onclick="browseBackToTopics()">${browseState.selectedTopic}</span>`;
            }
            if (browseState.selectedSubtopic) {
                breadcrumbHTML += ` > <span onclick="browseBackToSubtopics()">${browseState.selectedSubtopic}</span>`;
            }
            if (browseState.selectedYear) {
                breadcrumbHTML += ` > ${browseState.selectedYear}`;
            }
            breadcrumb.innerHTML = breadcrumbHTML;

            // Fetch browse data
            let url = `/api/subject/${appState.currentSubject}/browse?level=${browseState.level}`;
            if (browseState.selectedTopic) {
                url += `&topics=${browseState.selectedTopic}`;
            }
            if (browseState.selectedSubtopic) {
                url += `&subtopics=${browseState.selectedSubtopic}`;
            }
            if (browseState.selectedYear) {
                url += `&year=${browseState.selectedYear}`;
            }

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.length === 0) {
                    container.innerHTML = '<p class="empty-state">No items found</p>';
                    return;
                }

                container.innerHTML = data.map(item => `
                    <div class="browse-item" onclick="browseSelect('${item.name || item.question_id}')">
                        <span class="browse-item-name">${item.name || item.question_id}</span>
                        <span class="browse-item-count">${item.count !== undefined ? item.count + ' questions' : ''}</span>
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = '<p class="empty-state">Error loading browse data</p>';
            }
        }

        function browseSelect(name) {
            if (browseState.level === 'topics') {
                browseState.selectedTopic = name;
                browseState.level = 'subtopics';
            } else if (browseState.level === 'subtopics') {
                browseState.selectedSubtopic = name;
                browseState.level = 'years';
            } else if (browseState.level === 'years') {
                browseState.selectedYear = name;
                browseState.level = 'questions';
            } else if (browseState.level === 'questions') {
                // Load the question
                switchMode('random');
                loadQuestionById(name);
                return;
            }
            renderBrowseLevel();
        }

        function browseReset() {
            browseState = { level: 'topics', selectedTopic: null, selectedSubtopic: null, selectedYear: null };
            renderBrowseLevel();
        }

        function browseBackToTopics() {
            browseState = { level: 'topics', selectedTopic: null, selectedSubtopic: null, selectedYear: null };
            renderBrowseLevel();
        }

        function browseBackToSubtopics() {
            browseState.level = 'subtopics';
            browseState.selectedSubtopic = null;
            browseState.selectedYear = null;
            renderBrowseLevel();
        }

        // ===== GENERATE PAPER MODE =====
        let generatedQuestions = [];

        async function enterGenerateMode() {
            // Get count of matching questions
            await updateMatchingCount();
        }

        async function updateMatchingCount() {
            try {
                const params = new URLSearchParams();
                const selectedPapers = Array.from(document.querySelectorAll('#papersCheckboxes input:checked'))
                    .map(cb => cb.value);
                if (selectedPapers.length > 0) {
                    params.append('papers', selectedPapers.join(','));
                }

                const selectedTopics = Array.from(document.querySelectorAll('#topicsCheckboxes input:checked'))
                    .map(cb => cb.value);
                if (selectedTopics.length > 0) {
                    params.append('topics', selectedTopics.join(','));
                }

                const selectedSubtopics = Array.from(document.querySelectorAll('#subtopicsCheckboxes input:checked'))
                    .map(cb => cb.value);
                if (selectedSubtopics.length > 0) {
                    params.append('subtopics', selectedSubtopics.join(','));
                }

                params.append('year_min', document.getElementById('yearMin').value);
                params.append('year_max', document.getElementById('yearMax').value);
                params.append('limit', 999);

                const response = await fetch(`/api/subject/${appState.currentSubject}/filter?${params.toString()}`);
                const data = await response.json();

                document.getElementById('matchingCount').textContent = data.questions ? data.questions.length : 0;
            } catch (error) {
                document.getElementById('matchingCount').textContent = '0';
            }
        }

        async function generatePaper() {
            const count = parseInt(document.getElementById('paperQuestionsCount').value);
            if (!count || count < 1) {
                alert('Please enter a valid number of questions');
                return;
            }

            try {
                const params = new URLSearchParams();
                const selectedPapers = Array.from(document.querySelectorAll('#papersCheckboxes input:checked'))
                    .map(cb => cb.value);
                if (selectedPapers.length > 0) {
                    params.append('papers', selectedPapers.join(','));
                }

                const selectedTopics = Array.from(document.querySelectorAll('#topicsCheckboxes input:checked'))
                    .map(cb => cb.value);
                if (selectedTopics.length > 0) {
                    params.append('topics', selectedTopics.join(','));
                }

                const selectedSubtopics = Array.from(document.querySelectorAll('#subtopicsCheckboxes input:checked'))
                    .map(cb => cb.value);
                if (selectedSubtopics.length > 0) {
                    params.append('subtopics', selectedSubtopics.join(','));
                }

                params.append('year_min', document.getElementById('yearMin').value);
                params.append('year_max', document.getElementById('yearMax').value);
                params.append('limit', count);

                const response = await fetch(`/api/subject/${appState.currentSubject}/filter?${params.toString()}`);
                const data = await response.json();

                if (!data.questions || data.questions.length === 0) {
                    alert('No questions found matching your filters');
                    return;
                }

                generatedQuestions = data.questions;
                await renderGeneratedPaper();
            } catch (error) {
                alert('Error generating paper: ' + error.message);
            }
        }

        let showPaperAnswers = false;
        let paperDisplayData = [];

        async function renderGeneratedPaper() {
            const container = document.getElementById('generatedPaper');
            paperDisplayData = [];

            let paperHTML = '<div class="paper-actions">';
            paperHTML += '<button class="btn" onclick="togglePaperAnswers()">👁️ Show/Hide Answers</button>';
            paperHTML += '<button class="btn" onclick="window.print()">🖨️ Print</button>';
            paperHTML += '<button class="btn btn-secondary" onclick="savePaperConfig()">💾 Save Configuration</button>';
            paperHTML += '</div>';

            paperHTML += '<h2>Generated Question Paper</h2>';
            paperHTML += `<p style="color: var(--text-secondary);">${generatedQuestions.length} questions</p>`;

            for (let i = 0; i < generatedQuestions.length; i++) {
                const q = generatedQuestions[i];
                paperHTML += `<div class="paper-question" id="paper-q-${i}">`;
                paperHTML += `<h3>Question ${i + 1}: ${q.question_id}</h3>`;
                paperHTML += `<p style="color: var(--text-secondary); font-size: 0.9rem;">${q.primary_topic || ''} ${q.primary_subtopic || ''} • ${q.year || ''}</p>`;

                // Load question images/text
                try {
                    const displayResponse = await fetch(`/api/subject/${appState.currentSubject}/question/${q.question_id}`);
                    const displayData = await displayResponse.json();
                    paperDisplayData.push(displayData);

                    if (displayData.mode === 'image') {
                        displayData.images.forEach(imgName => {
                            paperHTML += `<img src="/api/unified/image/${appState.currentSubject}/${displayData.relative_path}/${imgName}" class="question-image inverted" style="max-width: 100%; margin: 1rem 0;">`;
                        });
                    } else {
                        paperHTML += `<div style="padding: 1rem; background: var(--bg-primary); border-radius: 4px;">`;
                        paperHTML += `<p>${displayData.text.part_a || displayData.text.full_text}</p>`;
                        if (displayData.text.part_b) {
                            paperHTML += `<p><strong>Part B:</strong> ${displayData.text.part_b}</p>`;
                        }
                        paperHTML += `</div>`;
                    }

                    // Add answer section (hidden by default)
                    paperHTML += `<div class="paper-answer hidden" id="paper-answer-${i}">`;
                    paperHTML += `<div style="margin-top: 2rem; padding-top: 1rem; border-top: 3px solid var(--accent-current);">`;
                    paperHTML += `<h4 style="color: var(--accent-current);">ANSWER:</h4>`;

                    if (displayData.mode === 'image' && displayData.answer_images && displayData.answer_images.length > 0) {
                        displayData.answer_images.forEach(imgName => {
                            paperHTML += `<img src="/api/unified/image/${appState.currentSubject}/${displayData.relative_path}/${imgName}" class="question-image inverted" style="max-width: 100%; margin: 1rem 0;">`;
                        });
                    } else if (displayData.text && displayData.text.markscheme) {
                        paperHTML += `<div style="padding: 1rem; background: var(--bg-tertiary); border-radius: 4px;">`;
                        paperHTML += `<pre style="white-space: pre-wrap;">${displayData.text.markscheme}</pre>`;
                        paperHTML += `</div>`;
                    } else {
                        paperHTML += `<p style="color: var(--text-secondary);">No answer available</p>`;
                    }

                    paperHTML += `</div></div>`;
                } catch (error) {
                    paperHTML += `<p style="color: red;">Error loading question</p>`;
                }

                paperHTML += `</div>`;
            }

            container.innerHTML = paperHTML;
        }

        function togglePaperAnswers() {
            showPaperAnswers = !showPaperAnswers;

            for (let i = 0; i < generatedQuestions.length; i++) {
                const answerEl = document.getElementById(`paper-answer-${i}`);
                if (answerEl) {
                    if (showPaperAnswers) {
                        answerEl.classList.remove('hidden');
                    } else {
                        answerEl.classList.add('hidden');
                    }
                }
            }
        }

        function savePaperConfig() {
            alert('Paper configuration saved! (Feature coming soon - will save to database)');
        }

        // ===== EVENT LISTENERS =====
        document.getElementById('randomBtn').addEventListener('click', () => {
            switchMode('random');
            loadRandomQuestion();
        });
        document.getElementById('browseBtn').addEventListener('click', () => switchMode('browse'));
        document.getElementById('generateBtn').addEventListener('click', () => switchMode('generate'));
        document.getElementById('generatePaperBtn').addEventListener('click', generatePaper);

        document.getElementById('showAnswerBtn').addEventListener('click', showAnswer);
        document.getElementById('historyBtn').addEventListener('click', openHistoryModal);
        document.getElementById('savedBtn').addEventListener('click', openSavedModal);
        document.getElementById('saveBtn').addEventListener('click', toggleSaveQuestion);
        document.getElementById('notesBtn').addEventListener('click', openNotesModal);

        // Chat modal events
        document.getElementById('modalSendChatBtn').addEventListener('click', () => {
            const input = document.getElementById('modalChatInput');
            const message = input.value.trim();
            if (message) {
                socket.emit('send_message', { message });
                input.value = '';
                closeChatModal();
            }
        });

        document.getElementById('modalChatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('modalSendChatBtn').click();
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // 't' key opens chat modal (only if not typing in an input)
            if (e.key === 't' && !['INPUT', 'TEXTAREA'].includes(e.target.tagName)) {
                e.preventDefault();
                openChatModal();
            }

            // Escape key closes any open modal
            if (e.key === 'Escape') {
                closeChatModal();
                closeHistoryModal();
                closeSavedModal();
                closeNotesModal();
            }
        });

        // ===== INITIALIZATION =====
        updateThemeColor();
        loadSubjectInfo();

        // Check if user is logged in
        fetch('/api/check-auth')
            .then(r => r.json())
            .then(data => {
                if (data.authenticated) {
                    document.getElementById('username').textContent = data.username;
                }
            })
            .catch(() => {});
    </script>
</body>
</html>
