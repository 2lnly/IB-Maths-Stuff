<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB Economics SL stuff</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1638;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .bg-shape {
            position: fixed;
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
        }

        .bg-shape:nth-child(1) {
            width: 300px;
            height: 300px;
            background: #7b4a9d;
            border-radius: 50%;
            top: 10%;
            left: 10%;
            animation: float 20s infinite ease-in-out;
        }

        .bg-shape:nth-child(2) {
            width: 200px;
            height: 200px;
            background: #6a3a8f;
            border-radius: 20%;
            top: 60%;
            right: 15%;
            animation: float 15s infinite ease-in-out reverse;
            transform: rotate(45deg);
        }

        .bg-shape:nth-child(3) {
            width: 0;
            height: 0;
            border-left: 125px solid transparent;
            border-right: 125px solid transparent;
            border-bottom: 250px solid #8a5a9d;
            background: transparent;
            bottom: 20%;
            left: 20%;
            animation: float 18s infinite ease-in-out;
        }

        .bg-shape:nth-child(4) {
            width: 180px;
            height: 180px;
            background: #7a4a8a;
            border-radius: 30px;
            top: 30%;
            right: 30%;
            animation: float 22s infinite ease-in-out reverse;
        }

        .bg-shape:nth-child(5) {
            width: 220px;
            height: 140px;
            background: #6a6a8d;
            border-radius: 50%;
            top: 45%;
            left: 50%;
            animation: float 17s infinite ease-in-out;
        }

        .bg-shape:nth-child(6) {
            width: 160px;
            height: 160px;
            background: #7a6a8a;
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
            bottom: 35%;
            right: 20%;
            animation: float 19s infinite ease-in-out reverse;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }

        .container, .header, .question-container {
            position: relative;
            z-index: 1;
        }

        .header {
            z-index: 100;
        }

        #historyPanel, #savedPanel {
            position: relative;
            z-index: 10;
        }

        #questionsWrapper {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .container {
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            max-width: calc(1200px * 0.65);
            margin-left: auto;
            margin-right: auto;
        }

        .header h1 {
            color: #333;
            margin-bottom: 5px;
        }

        .header .author {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        select, button {
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #8b5cf6;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        select {
            background: white;
            color: #333;
        }

        button {
            background: #8b5cf6;
            color: white;
            font-weight: 600;
        }

        button:hover {
            background: #7c3aed;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4);
        }

        .question-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            max-width: calc(1200px * 0.65);
            margin-left: auto;
            margin-right: auto;
            transition: max-width 0.3s ease;
        }

        .question-container.wide {
            max-width: calc((1200px * 0.65) * 2);
        }

        .question-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        .question-meta {
            color: #666;
        }

        .question-meta span {
            background: #f0f0f0;
            padding: 5px 12px;
            border-radius: 5px;
            margin-right: 10px;
            font-size: 14px;
        }

        .question-content {
            margin-top: 20px;
        }

        .question-part {
            margin-bottom: 25px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .part-label {
            font-weight: bold;
            color: #8b5cf6;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .question-text {
            line-height: 1.8;
            color: #333;
            white-space: pre-wrap;
        }

        .markscheme-section {
            margin-top: 20px;
        }

        .markscheme {
            background: #f0fdf4;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #10b981;
        }

        .markscheme h3 {
            color: #10b981;
            margin-bottom: 15px;
        }

        .markscheme-text {
            white-space: pre-wrap;
            line-height: 1.6;
            color: #374151;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn-show-answer {
            background: #3b82f6;
        }

        .btn-show-answer:hover {
            background: #2563eb;
        }

        .btn-chatgpt {
            background: #3b82f6;
        }

        .btn-chatgpt:hover {
            background: #2563eb;
        }

        .btn-gabriel {
            background: #6b7280;
        }

        .btn-gabriel:hover {
            background: #4b5563;
        }

        .btn-gabriel.active {
            background: #10b981;
        }

        .btn-gabriel.active:hover {
            background: #059669;
        }

        .btn-auth {
            padding: 8px 16px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-auth:hover {
            background: #2563eb;
        }

        .btn-physics {
            padding: 8px 16px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-physics:hover {
            background: #059669;
        }

        .btn-logout {
            padding: 8px 16px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 10px;
        }

        .btn-logout:hover {
            background: #dc2626;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #333;
            font-weight: 500;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .switch-mode {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }

        .switch-mode a {
            color: #3b82f6;
            cursor: pointer;
            text-decoration: underline;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .password-btn {
            flex: 1;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border: 3px solid #ddd;
            border-radius: 8px;
            background: white;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
        }

        .password-btn:hover {
            border-color: #3b82f6;
            transform: scale(1.05);
        }

        .password-btn.selected {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        /* Dropdown styles */
        .history-dropdown {
            position: relative;
            display: inline-block;
            z-index: 2000;
        }

        .history-btn {
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            background: #6b7280;
            color: white;
            border: 2px solid #6b7280;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            z-index: 2001;
        }

        .history-btn:hover {
            background: #4b5563;
            border-color: #4b5563;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: white;
            min-width: 180px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            border-radius: 8px;
            z-index: 2002;
            overflow: hidden;
        }

        .dropdown-content button {
            color: #333;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            width: 100%;
            border: none;
            background: white;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .dropdown-content button:hover {
            background-color: #f3f4f6;
            transform: none;
            box-shadow: none;
        }

        .dropdown-content button.danger {
            color: #ef4444;
            border-top: 1px solid #eee;
        }

        .dropdown-content button.danger:hover {
            background-color: #fee2e2;
        }

        .history-dropdown:hover .dropdown-content {
            display: block;
        }


        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            select, button {
                width: 100%;
            }

            .images-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="bg-shape"></div>
    <div class="bg-shape"></div>
    <div class="bg-shape"></div>
    <div class="bg-shape"></div>
    <div class="bg-shape"></div>
    <div class="bg-shape"></div>

    <!-- Login/Register Modal -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Login</h2>
            <div id="errorMessage" class="error-message hidden"></div>
            <div class="form-group">
                <label for="usernameInput">Username</label>
                <input type="text" id="usernameInput" placeholder="Enter username" maxlength="20">
            </div>
            <div class="form-group">
                <label>Pick your password:</label>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button type="button" class="password-btn" onclick="selectPassword('1234')" id="password1234">1234</button>
                    <button type="button" class="password-btn" onclick="selectPassword('4321')" id="password4321">4321</button>
                </div>
                <input type="hidden" id="selectedPassword" value="">
            </div>
            <div class="modal-actions">
                <button class="btn-primary" id="submitBtn" onclick="submitAuth()">Login</button>
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
            </div>
            <div class="switch-mode">
                <span id="switchText">Don't have an account? <a onclick="switchMode()">Register</a></span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div>
                    <h1 style="margin: 0;">IB Economics SL stuff</h1>
                    <div class="author">by: Xiao He</div>
                </div>
                <div id="authSection" style="display: flex; gap: 10px; align-items: center;">
                    <a href="/" class="btn-physics">Math</a>
                    <a href="/physics" class="btn-physics">Physics</a>
                    <button onclick="showLoginModal()" class="btn-auth">Login</button>
                </div>
            </div>
            <div class="controls">
                <select id="paperSelect">
                    <option value="">All Papers</option>
                    <option value="Paper 1">Paper 1</option>
                    <option value="Paper 2">Paper 2</option>
                </select>
                <select id="topicSelect">
                    <option value="">All Topics</option>
                </select>
                <button onclick="loadRandomQuestion()">Random Question</button>
                <button id="gabrielModeBtn" onclick="toggleGabrielMode()" class="btn-gabriel">Gabriel Mode: OFF</button>
                <div class="history-dropdown">
                    <button class="history-btn">H</button>
                    <div class="dropdown-content">
                        <button onclick="showHistoryPanel()">📜 View History</button>
                        <button onclick="showSavedPanel()">⭐ Saved Questions</button>
                        <button onclick="closePanels()">❌ Close Panels</button>
                        <button onclick="clearAllData()" class="danger">🗑️ Clear Data</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- History Panel -->
        <div id="historyPanel" class="question-container hidden" style="margin-bottom: 20px;">
            <h2 style="margin-bottom: 15px;">Question History</h2>
            <div id="historyList" style="max-height: 400px; overflow-y: auto;"></div>
        </div>

        <!-- Saved Questions Panel -->
        <div id="savedPanel" class="question-container hidden" style="margin-bottom: 20px;">
            <h2 style="margin-bottom: 15px;">Saved Questions</h2>
            <div id="savedList" style="max-height: 400px; overflow-y: auto;"></div>
        </div>

        <div id="questionsWrapper">
        <div id="questionContainer" class="question-container hidden">
            <div class="question-info">
                <div class="question-meta">
                    <span id="paperInfo"></span>
                    <span id="topicInfo"></span>
                    <span id="yearInfo"></span>
                    <span id="questionNum"></span>
                </div>
                <div class="question-id" style="color: #999; font-size: 14px;" id="questionId"></div>
            </div>

            <div class="question-content" id="questionContent"></div>

            <div class="markscheme-section hidden" id="markschemeSection">
                <div class="markscheme">
                    <h3>Markscheme</h3>
                    <div class="markscheme-text" id="markschemeContent"></div>
                </div>
            </div>

            <div class="actions">
                <button class="btn-show-answer" onclick="showAnswer()">Show Answer</button>
                <button class="btn-chatgpt" onclick="askChatGPT()">Ask ChatGPT</button>
                <button id="saveBtn" class="btn-save" onclick="toggleSaveQuestion()" style="display: none;">☆</button>
            </div>
        </div>
        </div>

        <div id="loading" class="loading hidden">
            Loading question...
        </div>

        <div id="noQuestion" class="no-question hidden">
            &nbsp;
        </div>
    </div>

    <script>
        let currentQuestion = null;
        let gabrielMode = false;
        let questionHistory = [];
        let isLoginMode = true;
        let currentUser = null;

        function toggleGabrielMode() {
            gabrielMode = !gabrielMode;
            const btn = document.getElementById('gabrielModeBtn');
            if (gabrielMode) {
                btn.textContent = 'Gabriel Mode: ON';
                btn.classList.add('active');
            } else {
                btn.textContent = 'Gabriel Mode: OFF';
                btn.classList.remove('active');
                // Clear all extra questions when turning off
                questionHistory = [];
                const wrapper = document.getElementById('questionsWrapper');
                const containers = wrapper.querySelectorAll('.question-container:not(#questionContainer)');
                containers.forEach(c => c.remove());
            }
        }

        // Update topic options based on paper selection
        document.getElementById('paperSelect').addEventListener('change', function() {
            const paper = this.value;
            const topicSelect = document.getElementById('topicSelect');

            topicSelect.innerHTML = '<option value="">All Topics</option>';

            if (paper === 'Paper 1') {
                topicSelect.innerHTML += '<option value="Microeconomics">Microeconomics</option>';
                topicSelect.innerHTML += '<option value="Macroeconomics">Macroeconomics</option>';
            } else if (paper === 'Paper 2') {
                topicSelect.innerHTML += '<option value="Case Study">Case Study</option>';
            }
        });

        async function loadRandomQuestion() {
            const paper = document.getElementById('paperSelect').value;
            const topic = document.getElementById('topicSelect').value;

            // Clear all Gabriel mode questions when loading new question normally
            if (!gabrielMode) {
                const wrapper = document.getElementById('questionsWrapper');
                const containers = wrapper.querySelectorAll('.question-container:not(#questionContainer)');
                containers.forEach(c => c.remove());
            }

            // Show loading
            document.getElementById('questionContainer').classList.add('hidden');
            document.getElementById('noQuestion').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            // Build API URL with filters
            let url = '/api/economics/random';
            if (paper || topic) {
                const params = new URLSearchParams();
                if (paper) params.append('paper', paper);
                if (topic) params.append('topic', topic);
                url = `/api/economics/question/filter?${params.toString()}`;
            }

            try {
                const response = await fetch(url);
                const data = await response.json();
                currentQuestion = data;
                displayQuestion(data);
            } catch (error) {
                console.error('Error loading question:', error);
                alert('Error loading question. Please try again.');
            }

            document.getElementById('loading').classList.add('hidden');
        }

        async function loadRandomQuestionGabrielMode() {
            const paper = document.getElementById('paperSelect').value;
            const topic = document.getElementById('topicSelect').value;

            // Build API URL with filters
            let url = '/api/economics/random';
            if (paper || topic) {
                const params = new URLSearchParams();
                if (paper) params.append('paper', paper);
                if (topic) params.append('topic', topic);
                url = `/api/economics/question/filter?${params.toString()}`;
            }

            try {
                const response = await fetch(url);
                const data = await response.json();

                // Generate unique timestamp FIRST
                const timestamp = Date.now();

                // Create a new question container
                const newContainer = document.createElement('div');
                newContainer.className = 'question-container';
                newContainer.style.marginTop = '30px';

                // Build question HTML
                let questionHTML = `
                    <div class="question-info">
                        <div class="question-meta">
                            <span>${data.paper}</span>
                            <span>${data.topic}</span>
                            <span>${data.year} ${data.session} ${data.tz}</span>
                            <span>${data.question_num}</span>
                        </div>
                        <div class="question-id" style="color: #999; font-size: 14px;">${data.question_id}</div>
                    </div>
                    <div class="question-content-${timestamp}">
                `;

                if (data.paper === 'Paper 1') {
                    if (data.part_a) {
                        questionHTML += `
                            <div class="question-part">
                                <div class="part-label">(a) [10 marks]</div>
                                <div class="question-text">${data.part_a}</div>
                            </div>
                        `;
                    }
                    if (data.part_b) {
                        questionHTML += `
                            <div class="question-part">
                                <div class="part-label">(b) [15 marks]</div>
                                <div class="question-text">${data.part_b}</div>
                            </div>
                        `;
                    }
                } else {
                    questionHTML += `<div class="question-text">${data.full_text}</div>`;
                }

                questionHTML += `</div>`;

                questionHTML += `
                    <div class="markscheme-section hidden markscheme-section-${timestamp}">
                        <div class="markscheme">
                            <h3>Markscheme</h3>
                            <div class="markscheme-text">${data.markscheme || 'No markscheme available'}</div>
                        </div>
                    </div>
                    <div class="actions">
                        <button class="btn-show-answer" onclick="showAnswerForContainer(this, ${timestamp})">Show Answer</button>
                        <button class="btn-chatgpt" onclick="askChatGPTForContainer(this)">Ask ChatGPT</button>
                    </div>
                `;

                newContainer.innerHTML = questionHTML;
                document.getElementById('questionsWrapper').appendChild(newContainer);

                // Store question data
                newContainer.dataset.questionData = JSON.stringify(data);

            } catch (error) {
                console.error('Error loading question:', error);
            }
        }

        function displayQuestion(question) {
            // Show container
            const questionContainer = document.getElementById('questionContainer');
            const markschemeSection = document.getElementById('markschemeSection');

            questionContainer.classList.remove('hidden');
            markschemeSection.classList.add('hidden');

            // Reset wide class (only added when answer is shown)
            questionContainer.classList.remove('wide');

            // Update metadata
            document.getElementById('paperInfo').textContent = question.paper;
            document.getElementById('topicInfo').textContent = question.topic;
            document.getElementById('yearInfo').textContent = `${question.year} ${question.session} ${question.tz}`;
            document.getElementById('questionNum').textContent = question.question_num;
            document.getElementById('questionId').textContent = question.question_id;

            // Track view and check if saved
            if (currentUser) {
                trackView(question.question_id);
                checkIfSaved(question.question_id);
            } else {
                document.getElementById('saveBtn').style.display = 'none';
            }

            // Display question content
            const content = document.getElementById('questionContent');
            content.innerHTML = '';

            if (question.paper === 'Paper 1') {
                // Show parts (a) and (b)
                if (question.part_a) {
                    const partA = document.createElement('div');
                    partA.className = 'question-part';
                    partA.innerHTML = `
                        <div class="part-label">(a) [10 marks]</div>
                        <div class="question-text">${question.part_a}</div>
                    `;
                    content.appendChild(partA);
                }
                if (question.part_b) {
                    const partB = document.createElement('div');
                    partB.className = 'question-part';
                    partB.innerHTML = `
                        <div class="part-label">(b) [15 marks]</div>
                        <div class="question-text">${question.part_b}</div>
                    `;
                    content.appendChild(partB);
                }
            } else {
                // Paper 2 - case study
                const fullText = document.createElement('div');
                fullText.className = 'question-text';
                fullText.textContent = question.full_text;
                content.appendChild(fullText);
            }

            // Load markscheme
            const markschemeContent = document.getElementById('markschemeContent');
            if (question.markscheme) {
                markschemeContent.textContent = question.markscheme;
            } else {
                markschemeContent.textContent = 'No markscheme available for this question.';
            }
        }

        function showAnswer() {
            const markschemeSection = document.getElementById('markschemeSection');
            markschemeSection.classList.remove('hidden');

            // Always expand when both question and answer are visible
            document.getElementById('questionContainer').classList.add('wide');

            // If Gabriel mode is on, load a new question below
            if (gabrielMode) {
                setTimeout(() => {
                    loadRandomQuestionGabrielMode();
                }, 500);
            }
        }

        function askChatGPT() {
            if (!currentQuestion) {
                alert('Please load a question first');
                return;
            }

            // Build the question text
            let questionText = `IB Economics ${currentQuestion.paper} - ${currentQuestion.topic}\n`;
            questionText += `${currentQuestion.year} ${currentQuestion.session} ${currentQuestion.tz}\n`;
            questionText += `${currentQuestion.question_num}\n\n`;

            if (currentQuestion.paper === 'Paper 1') {
                if (currentQuestion.part_a) {
                    questionText += `(a) [10 marks]\n${currentQuestion.part_a}\n\n`;
                }
                if (currentQuestion.part_b) {
                    questionText += `(b) [15 marks]\n${currentQuestion.part_b}\n`;
                }
            } else {
                questionText += currentQuestion.full_text;
            }

            // Replace spaces with + signs for URL
            const encodedText = questionText.replace(/ /g, '+');
            const url = `https://chatgpt.com/?prompt=${encodedText}`;

            window.open(url, '_blank');
        }

        function showAnswerForContainer(button, timestamp) {
            const container = button.closest('.question-container');
            const markschemeSection = container.querySelector(`.markscheme-section-${timestamp}`);

            markschemeSection.classList.remove('hidden');
            container.classList.add('wide');

            // Load new question in Gabriel mode
            if (gabrielMode) {
                setTimeout(() => {
                    loadRandomQuestionGabrielMode();
                }, 500);
            }
        }

        function askChatGPTForContainer(button) {
            const container = button.closest('.question-container');
            const data = JSON.parse(container.dataset.questionData);

            // Build the question text
            let questionText = `IB Economics ${data.paper} - ${data.topic}\n`;
            questionText += `${data.year} ${data.session} ${data.tz}\n`;
            questionText += `${data.question_num}\n\n`;

            if (data.paper === 'Paper 1') {
                if (data.part_a) {
                    questionText += `(a) [10 marks]\n${data.part_a}\n\n`;
                }
                if (data.part_b) {
                    questionText += `(b) [15 marks]\n${data.part_b}\n`;
                }
            } else {
                questionText += data.full_text;
            }

            const encodedText = questionText.replace(/ /g, '+');
            const url = `https://chatgpt.com/?prompt=${encodedText}`;

            window.open(url, '_blank');
        }

        // Auth functions
        function selectPassword(password) {
            document.getElementById('selectedPassword').value = password;
            document.getElementById('password1234').classList.remove('selected');
            document.getElementById('password4321').classList.remove('selected');
            document.getElementById('password' + password).classList.add('selected');
        }

        function showLoginModal() {
            isLoginMode = true;
            document.getElementById('modalTitle').textContent = 'Login';
            document.getElementById('submitBtn').textContent = 'Login';
            document.getElementById('switchText').innerHTML = 'Don\'t have an account? <a onclick="switchMode()">Register</a>';
            document.getElementById('usernameInput').value = '';
            document.getElementById('selectedPassword').value = '';
            document.getElementById('password1234').classList.remove('selected');
            document.getElementById('password4321').classList.remove('selected');
            document.getElementById('errorMessage').classList.add('hidden');
            document.getElementById('authModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('authModal').classList.remove('show');
        }

        function switchMode() {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                document.getElementById('modalTitle').textContent = 'Login';
                document.getElementById('submitBtn').textContent = 'Login';
                document.getElementById('switchText').innerHTML = 'Don\'t have an account? <a onclick="switchMode()">Register</a>';
            } else {
                document.getElementById('modalTitle').textContent = 'Register';
                document.getElementById('submitBtn').textContent = 'Register';
                document.getElementById('switchText').innerHTML = 'Already have an account? <a onclick="switchMode()">Login</a>';
            }
            document.getElementById('selectedPassword').value = '';
            document.getElementById('password1234').classList.remove('selected');
            document.getElementById('password4321').classList.remove('selected');
            document.getElementById('errorMessage').classList.add('hidden');
        }

        async function submitAuth() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('selectedPassword').value;
            const errorDiv = document.getElementById('errorMessage');

            if (!username) {
                errorDiv.textContent = 'Please enter a username';
                errorDiv.classList.remove('hidden');
                return;
            }

            if (!password) {
                errorDiv.textContent = 'Please select a password (1234 or 4321)';
                errorDiv.classList.remove('hidden');
                return;
            }

            const endpoint = isLoginMode ? '/api/login' : '/api/register';

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    currentUser = data.username;
                    updateAuthUI();
                    closeModal();
                } else {
                    errorDiv.textContent = data.message;
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'Error connecting to server';
                errorDiv.classList.remove('hidden');
            }
        }

        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
                currentUser = null;
                updateAuthUI();
                // Hide save button on logout
                document.getElementById('saveBtn').style.display = 'none';
            } catch (error) {
                console.error('Logout error:', error);
            }
        }

        function updateAuthUI() {
            const authSection = document.getElementById('authSection');
            if (currentUser) {
                authSection.innerHTML = `
                    <a href="/" class="btn-physics">Math</a>
                    <a href="/physics" class="btn-physics">Physics</a>
                    <div class="user-info">
                        <span>${currentUser}</span>
                        <button onclick="logout()" class="btn-logout">Logout</button>
                    </div>
                `;
                // Show save button if there's a current question
                if (currentQuestion) {
                    document.getElementById('saveBtn').style.display = 'inline-block';
                }
            } else {
                authSection.innerHTML = `
                    <a href="/" class="btn-physics">Math</a>
                    <a href="/physics" class="btn-physics">Physics</a>
                    <button onclick="showLoginModal()" class="btn-auth">Login</button>
                `;
                document.getElementById('saveBtn').style.display = 'none';
            }
        }

        async function checkAuthStatus() {
            try {
                const response = await fetch('/api/current-user');
                const data = await response.json();
                if (data.logged_in) {
                    currentUser = data.username;
                    updateAuthUI();
                }
            } catch (error) {
                console.error('Auth check error:', error);
            }
        }

        // Save/History Functions
        async function trackView(questionId) {
            if (!currentUser || !questionId) return;

            try {
                await fetch('/api/track-view', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question_id: questionId,
                        subject: 'economics'
                    })
                });
            } catch (error) {
                console.error('Error tracking view:', error);
            }
        }

        async function toggleSaveQuestion() {
            if (!currentUser) {
                alert('Please log in to save questions');
                return;
            }

            const saveBtn = document.getElementById('saveBtn');
            const isSaved = saveBtn.textContent.trim() === '⭐';

            try {
                if (isSaved) {
                    // Unsave
                    await fetch('/api/save-question', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            question_id: currentQuestion.question_id,
                            subject: 'economics'
                        })
                    });
                    saveBtn.textContent = '☆';
                    saveBtn.classList.remove('saved');
                } else {
                    // Save
                    await fetch('/api/save-question', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            question_id: currentQuestion.question_id,
                            subject: 'economics'
                        })
                    });
                    saveBtn.textContent = '⭐';
                    saveBtn.classList.add('saved');
                }
            } catch (error) {
                console.error('Error saving/unsaving question:', error);
                alert('Error saving question');
            }
        }

        async function checkIfSaved(questionId) {
            if (!currentUser || !questionId) {
                document.getElementById('saveBtn').style.display = 'none';
                return;
            }

            try {
                const response = await fetch(`/api/is-saved?question_id=${questionId}&subject=economics`);
                const data = await response.json();
                const saveBtn = document.getElementById('saveBtn');
                saveBtn.style.display = 'inline-block';

                if (data.saved) {
                    saveBtn.textContent = '⭐';
                    saveBtn.classList.add('saved');
                } else {
                    saveBtn.textContent = '☆';
                    saveBtn.classList.remove('saved');
                }
            } catch (error) {
                console.error('Error checking if saved:', error);
            }
        }

        async function showHistoryPanel() {
            const panel = document.getElementById('historyPanel');
            const savedPanel = document.getElementById('savedPanel');

            // Hide saved panel if open
            savedPanel.classList.add('hidden');

            // Show history panel
            panel.classList.remove('hidden');

            if (!currentUser) {
                document.getElementById('historyList').innerHTML = '<p style="text-align: center; color: #666;">Please log in to view your history</p>';
                return;
            }

            try {
                const response = await fetch('/api/history?subject=economics&limit=50');
                const data = await response.json();
                const historyList = document.getElementById('historyList');

                if (data.history.length === 0) {
                    historyList.innerHTML = '<p style="text-align: center; color: #666;">No history yet</p>';
                } else {
                    historyList.innerHTML = data.history.map(item => `
                        <div class="history-item" onclick="loadQuestionById('${item.question_id}')">
                            <strong>${item.question_id}</strong><br>
                            <small style="color: #666;">${item.viewed_at}</small>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading history:', error);
                document.getElementById('historyList').innerHTML = '<p style="text-align: center; color: #ef4444;">Error loading history</p>';
            }
        }

        async function showSavedPanel() {
            const panel = document.getElementById('savedPanel');
            const historyPanel = document.getElementById('historyPanel');

            // Hide history panel if open
            historyPanel.classList.add('hidden');

            // Show saved panel
            panel.classList.remove('hidden');

            if (!currentUser) {
                document.getElementById('savedList').innerHTML = '<p style="text-align: center; color: #666;">Please log in to view saved questions</p>';
                return;
            }

            try {
                const response = await fetch('/api/saved?subject=economics');
                const data = await response.json();
                const savedList = document.getElementById('savedList');

                if (data.saved.length === 0) {
                    savedList.innerHTML = '<p style="text-align: center; color: #666;">No saved questions yet</p>';
                } else {
                    savedList.innerHTML = data.saved.map(item => `
                        <div class="saved-item" onclick="loadQuestionById('${item.question_id}')">
                            <strong>${item.question_id}</strong><br>
                            ${item.notes ? `<p style="color: #666; margin-top: 5px;">${item.notes}</p>` : ''}
                            <small style="color: #666;">Saved: ${item.saved_at}</small>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading saved questions:', error);
                document.getElementById('savedList').innerHTML = '<p style="text-align: center; color: #ef4444;">Error loading saved questions</p>';
            }
        }

        function closePanels() {
            document.getElementById('historyPanel').classList.add('hidden');
            document.getElementById('savedPanel').classList.add('hidden');
        }

        async function clearAllData() {
            if (!currentUser) {
                alert('Please log in first');
                return;
            }

            if (!confirm('Are you sure you want to clear ALL your economics history and saved questions? This cannot be undone!')) {
                return;
            }

            try {
                const response = await fetch('/api/clear-all', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subject: 'economics' })
                });

                const data = await response.json();
                if (data.success) {
                    alert('All data cleared successfully!');
                    closePanels();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                console.error('Error clearing data:', error);
                alert('Error clearing data');
            }
        }

        async function loadQuestionById(questionId) {
            // Hide history/saved panels
            document.getElementById('historyPanel').classList.add('hidden');
            document.getElementById('savedPanel').classList.add('hidden');

            // Show loading
            document.getElementById('questionContainer').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            try {
                const response = await fetch(`/api/economics/question/${questionId}`);
                const data = await response.json();
                currentQuestion = data;
                displayQuestion(data);
            } catch (error) {
                console.error('Error loading question:', error);
                alert('Error loading question. Please try again.');
            }

            document.getElementById('loading').classList.add('hidden');
        }

        // Enter key to submit in modal
        document.getElementById('usernameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitAuth();
            }
        });

        // Close modal on outside click
        document.getElementById('authModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Initialize
        checkAuthStatus();
        document.getElementById('noQuestion').classList.remove('hidden');
    </script>
</body>
</html>
