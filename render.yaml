services:
  - type: web
    name: ibmath-practice
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd web && gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
    disk:
      name: ibmath-data
      mountPath: /data
      sizeGB: 1
